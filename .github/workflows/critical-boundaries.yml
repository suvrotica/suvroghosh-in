name: Critical application boundaries

on:
  pull_request:
    paths:
      - '.github/workflows/critical-boundaries.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'svelte.config.js'
      - 'vite.config.ts'
      - 'vitest.config.ts'
      - 'tsconfig.json'
      - 'src/hooks.server.ts'
      - 'src/service-worker.ts'
      - 'scripts/service-worker.test.mjs'
      - 'scripts/measurement-policy.test.mjs'
      - 'scripts/youtube-deferred.test.mjs'
      - 'scripts/notebook-canonical.test.mjs'
      - 'scripts/validate-links.mjs'
      - 'scripts/validate-links.test.mjs'
      - 'scripts/refresh-seo-metadata.mjs'
      - 'scripts/refresh-seo-metadata.test.mjs'
      - 'src/lib/measurement.ts'
      - 'src/lib/privacy/**'
      - 'src/lib/analytics/**'
      - 'src/lib/components/privacy/**'
      - 'src/lib/components/comments/**'
      - 'src/lib/comments/**'
      - 'supabase/migrations/*post_comments*'
      - 'supabase/tests/post-comments.integration.test.mjs'
      - 'src/lib/components/analytics/**'
      - 'src/routes/privacy/**'
      - 'supabase/migrations/*analytics*'
      - 'supabase/analytics-cron.sql'
      - 'src/lib/components/blog/YouTube.svelte'
      - 'src/routes/\+layout.svelte'
      - 'src/routes/resume/\+page.svelte'
      - 'vercel.json'
      - 'src/lib/components/notes/PublicNoteCanvas.svelte'
      - 'src/lib/server/**'
      - '!src/lib/server/generated/**'
      - 'src/lib/notes/**'
      - 'src/lib/components/blog/TTS.svelte'
      - 'src/lib/components/blog/BrowserTTS.svelte'
      - 'src/lib/components/blog/tts/**'
      - 'scripts/article-narration*'
      - 'scripts/compress-narration*'
      - '.github/workflows/article-narration.yml'
      - 'scripts/github-narration*'
      - 'scripts/lib/github-narration-state.mjs'
      - 'scripts/bootstrap-narration-actions*'
      - 'scripts/lib/google-tts.mjs'
      - 'scripts/lib/narration-quota.mjs'
      - 'scripts/lib/narration-segments.mjs'
      - 'scripts/narration-quota.test.mjs'
      - 'src/routes/contact/**'
      - 'src/routes/api/**'
      - 'src/routes/notes/**'
      - 'src/lib/visualizations/meaning-connection-map/**'
      - 'src/routes/blog/visualizations/the-meaning-connection-map/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/critical-boundaries.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'svelte.config.js'
      - 'vite.config.ts'
      - 'vitest.config.ts'
      - 'tsconfig.json'
      - 'src/hooks.server.ts'
      - 'src/service-worker.ts'
      - 'scripts/service-worker.test.mjs'
      - 'scripts/measurement-policy.test.mjs'
      - 'scripts/youtube-deferred.test.mjs'
      - 'scripts/notebook-canonical.test.mjs'
      - 'scripts/validate-links.mjs'
      - 'scripts/validate-links.test.mjs'
      - 'scripts/refresh-seo-metadata.mjs'
      - 'scripts/refresh-seo-metadata.test.mjs'
      - 'src/lib/measurement.ts'
      - 'src/lib/privacy/**'
      - 'src/lib/analytics/**'
      - 'src/lib/components/privacy/**'
      - 'src/lib/components/comments/**'
      - 'src/lib/comments/**'
      - 'supabase/migrations/*post_comments*'
      - 'supabase/tests/post-comments.integration.test.mjs'
      - 'src/lib/components/analytics/**'
      - 'src/routes/privacy/**'
      - 'supabase/migrations/*analytics*'
      - 'supabase/analytics-cron.sql'
      - 'src/lib/components/blog/YouTube.svelte'
      - 'src/routes/\+layout.svelte'
      - 'src/routes/resume/\+page.svelte'
      - 'vercel.json'
      - 'src/lib/components/notes/PublicNoteCanvas.svelte'
      - 'src/lib/server/**'
      - '!src/lib/server/generated/**'
      - 'src/lib/notes/**'
      - 'src/lib/components/blog/TTS.svelte'
      - 'src/lib/components/blog/BrowserTTS.svelte'
      - 'src/lib/components/blog/tts/**'
      - 'scripts/article-narration*'
      - 'scripts/compress-narration*'
      - '.github/workflows/article-narration.yml'
      - 'scripts/github-narration*'
      - 'scripts/lib/github-narration-state.mjs'
      - 'scripts/bootstrap-narration-actions*'
      - 'scripts/lib/google-tts.mjs'
      - 'scripts/lib/narration-quota.mjs'
      - 'scripts/lib/narration-segments.mjs'
      - 'scripts/narration-quota.test.mjs'
      - 'src/routes/contact/**'
      - 'src/routes/api/**'
      - 'src/routes/notes/**'
      - 'src/lib/visualizations/meaning-connection-map/**'
      - 'src/routes/blog/visualizations/the-meaning-connection-map/**'

permissions:
  contents: read

jobs:
  critical-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:critical
      - name: Install isolated comments SQL test runtime
        run: npm install --prefix "$RUNNER_TEMP/comments-sql-runtime" --no-save --package-lock=false @electric-sql/pglite@0.5.11
      - name: Verify comments migration under database roles
        run: npm run comments:sql:test
        env:
          COMMENTS_SQL_RUNTIME: ${{ runner.temp }}/comments-sql-runtime
      - run: npm run privacy:test
      - name: Install isolated SQL verification runtime
        run: npm install --prefix "${{ runner.temp }}/privacy-sql" --no-save --ignore-scripts --package-lock=false @electric-sql/pglite@0.5.11
      - run: npm run privacy:sql:test
        env:
          ANALYTICS_SQL_RUNTIME: ${{ runner.temp }}/privacy-sql
      - run: npm run narration:test
