name: CT laboratory regression

on:
  pull_request:
    paths:
      - '.github/workflows/ct-responsive.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.ct.config.ts'
      - 'scripts/ct-reconstruction-laboratory.test.mjs'
      - 'scripts/validate-content.mjs'
      - 'src/lib/components/blog/ArticleQuickAnswer.svelte'
      - 'src/lib/components/layout/Header.svelte'
      - 'src/lib/components/layout/ThemeSelect.svelte'
      - 'src/lib/components/motion/MotionSelect.svelte'
      - 'src/lib/components/visualizations/ct-reconstruction/**'
      - 'src/lib/content/posts.ts'
      - 'src/lib/posts/how-a-scanner-sees-reconstructing-a-body-from-shadows.md'
      - 'src/lib/visualizations/ct-reconstruction/**'
      - 'src/routes/blog/[category]/[slug]/+page.svelte'
      - 'tests/browser/ct-reconstruction-responsive.spec.ts'
      - 'tests/helpers/privacy-choice.ts'
      - 'src/lib/privacy/consent.ts'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ct-responsive.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.ct.config.ts'
      - 'scripts/ct-reconstruction-laboratory.test.mjs'
      - 'scripts/validate-content.mjs'
      - 'src/lib/components/blog/ArticleQuickAnswer.svelte'
      - 'src/lib/components/layout/Header.svelte'
      - 'src/lib/components/layout/ThemeSelect.svelte'
      - 'src/lib/components/motion/MotionSelect.svelte'
      - 'src/lib/components/visualizations/ct-reconstruction/**'
      - 'src/lib/content/posts.ts'
      - 'src/lib/posts/how-a-scanner-sees-reconstructing-a-body-from-shadows.md'
      - 'src/lib/visualizations/ct-reconstruction/**'
      - 'src/routes/blog/[category]/[slug]/+page.svelte'
      - 'tests/browser/ct-reconstruction-responsive.spec.ts'
      - 'tests/helpers/privacy-choice.ts'
      - 'src/lib/privacy/consent.ts'

permissions:
  contents: read

jobs:
  ct-laboratory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-10-28
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, verified 2026-10-28
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps --no-shell chromium

      - name: Check Svelte and TypeScript
        run: npm run check

      - name: Run CT numerical tests
        run: npm run ct-reconstruction:test

      - name: Run CT laboratory contracts
        run: npm run ct-laboratory:test

      - name: Run responsive browser regressions
        run: npm run ct-responsive:test
