name: Double-pendulum laboratory regression

on:
  pull_request:
    paths:
      - '.github/workflows/double-pendulum.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.double-pendulum.config.ts'
      - 'src/lib/components/visualizations/double-pendulum/**'
      - 'src/lib/posts/double-pendulum-chaos.md'
      - 'src/lib/visualizations/double-pendulum/**'
      - 'src/routes/blog/**'
      - 'static/images/double-pendulum-chaos.svg'
      - 'tests/browser/double-pendulum.spec.ts'
      - 'tests/helpers/privacy-choice.ts'
      - 'src/lib/privacy/consent.ts'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/double-pendulum.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.double-pendulum.config.ts'
      - 'src/lib/components/visualizations/double-pendulum/**'
      - 'src/lib/posts/double-pendulum-chaos.md'
      - 'src/lib/visualizations/double-pendulum/**'
      - 'src/routes/blog/**'
      - 'static/images/double-pendulum-chaos.svg'
      - 'tests/browser/double-pendulum.spec.ts'
      - 'tests/helpers/privacy-choice.ts'
      - 'src/lib/privacy/consent.ts'

permissions:
  contents: read

jobs:
  double-pendulum:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-10-28
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, verified 2026-10-28
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check Svelte and TypeScript
        run: npm run check

      - name: Run numerical tests
        run: npm run double-pendulum:test

      - name: Run browser acceptance suite
        run: npm run double-pendulum:browser:test
