      - 'src/lib/posts/the-shape-of-waiting.md'
      - 'src/lib/posts/between-a-click-and-a-page.md'
      - 'src/lib/posts/build-one-build-a-thousand.md'
      - 'src/lib/posts/the-six-week-shadow.md'
      - 'src/lib/posts/the-museum-of-almost.md'
      - 'src/lib/posts/anatomy-of-an-essay.md'
      - 'src/lib/posts/living-systems.md'
      - 'src/lib/posts/reading-is-not-homework-it-is-how-the-mind-keeps-change.md'
      - 'src/lib/posts/pod-mara-gechhe-calcutta-essay.md'
      - 'static/essay-anatomy/**'
      - 'src/lib/posts/mrinmoyee-the-durga-atelier.md'
      - 'src/lib/posts/the-scale-elevator-from-ion-to-city.md'
      - 'src/lib/posts/perceptron-from-scratch-in-mojo.md'
      - 'src/lib/posts/xor-with-multiple-perceptrons-in-mojo.md'
      - 'static/notebooks/**'
      - 'static/data/**'
      - 'static/images/visualizations/**'
      - 'static/videos/visualizations/scale-elevator/**'
      - 'static/images/bias-archipelago*.png'
      - 'static/images/belousov-zhabotinsky-laboratory.png'
      - 'static/fonts/**'
      - 'artifacts/bz-v2-search/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/feature-artifacts.yml'
      - 'tests/browser/navigation-links.spec.ts'
      - 'package.json'
      - 'package-lock.json'
      - '*.config.*'
      - 'tsconfig*.json'
      - '.npmrc'
      - '.prettier*'
      - 'requirements-*.txt'
      - 'pixi.toml'
      - 'pixi.lock'
      - 'vercel.json'
      - 'scripts/**'
      - '!scripts/image-optimization-manifest.json'
      - '!scripts/post-tags-manifest.json'
      - 'src/**'
      - '!src/lib/posts/**'
      - '!src/lib/generated/music-posts.ts'
      - '!src/lib/generated/media-gallery.ts'
      - '!src/lib/server/generated/image-dimensions.js'
      - 'src/lib/posts/the-profile-that-knows-almost-nothing-about-you.md'
      - 'src/lib/posts/through-a-different-glass.md'
      - 'src/lib/posts/the-bias-archipelago.md'
      - 'src/lib/posts/belousov-zhabotinsky-laboratory.md'
      - 'src/lib/posts/the-prior-authorization-machine.md'
      - 'src/lib/posts/the-patient-between-the-systems.md'
      - 'src/lib/posts/a-place-for-every-idea.md'
      - 'src/lib/posts/the-strange-attractor-orchestra.md'
      - 'src/lib/posts/the-piano-that-forgives.md'
      - 'src/lib/posts/the-shape-of-waiting.md'
      - 'src/lib/posts/between-a-click-and-a-page.md'
      - 'src/lib/posts/build-one-build-a-thousand.md'
      - 'src/lib/posts/the-six-week-shadow.md'
      - 'src/lib/posts/the-museum-of-almost.md'
      - 'src/lib/posts/anatomy-of-an-essay.md'
      - 'src/lib/posts/living-systems.md'
      - 'src/lib/posts/reading-is-not-homework-it-is-how-the-mind-keeps-change.md'
      - 'src/lib/posts/pod-mara-gechhe-calcutta-essay.md'
      - 'static/essay-anatomy/**'
      - 'src/lib/posts/mrinmoyee-the-durga-atelier.md'
      - 'src/lib/posts/the-scale-elevator-from-ion-to-city.md'
      - 'src/lib/posts/perceptron-from-scratch-in-mojo.md'
      - 'src/lib/posts/xor-with-multiple-perceptrons-in-mojo.md'
      - 'static/notebooks/**'
      - 'static/data/**'
      - 'static/images/visualizations/**'
      - 'static/videos/visualizations/scale-elevator/**'
      - 'static/images/bias-archipelago*.png'
      - 'static/images/belousov-zhabotinsky-laboratory.png'
      - 'static/fonts/**'
      - 'artifacts/bz-v2-search/**'

permissions:
  contents: read

jobs:
  feature-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # CI verifies committed media rather than transforming supplied artwork.
      IMAGE_OPTIMIZE_VERIFY_ONLY: '1'
      WORDCLOUD_VERIFY_ONLY: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Verify publishing workflow boundaries
        run: npm run build-workflow:test

      - name: Verify incremental notebook preparation
        run: npm run notebooks:test

      - name: Verify deterministic link-checking fixtures
        run: npm run links:test

      - name: Verify HTTP and TCP teaching-model invariants
        run: npm run http-tcp:test

      - name: Verify essay source analysis and specimen geometry
        run: npm run essay-anatomy:test

      - name: Verify Living Systems numerical invariants
        run: npm run living-systems:test

      - name: Check feature artifacts, notebooks and the complete site
        run: npm run build:full

      - name: Audit all public links on the local production preview
        run: npm run links:audit

      - name: Install full Chromium for navigation checks
        run: npx playwright install --with-deps --no-shell chromium

      - name: Verify footer and shared navigation on desktop and mobile
        run: npm run links:browser:test

      - name: Verify the HTTP and TCP instrument
        run: npm run http-tcp:browser:test

      - name: Verify essay anatomy reading, local analysis and portrait exports
        run: npm run essay-anatomy:browser:test

      - name: Verify Living Systems simulations, lifecycle and touch controls
        run: npm run living-systems:browser:test

      - name: Retain link-audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-link-audit
          path: |
            .codex-artifacts/site-links.json
            test-results
          if-no-files-found: ignore
