name: Notify IndexNow after production deployment

on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow-production
  cancel-in-progress: true

jobs:
  submit-sitemap:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       (github.event.deployment.environment == 'Production' ||
        github.event.deployment.environment == 'production'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
    steps:
      - name: Check out the deployed revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-10-28
        with:
          persist-credentials: false
          ref: ${{ github.event.deployment.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, verified 2026-10-28
        with:
          node-version: 24

      - name: Test IndexNow submission contracts
        run: node --test scripts/indexnow.test.mjs

      - name: Restore the previous production sitemap
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4, verified 2026-10-28
        with:
          path: .cache/indexnow/sitemap.xml
          key: indexnow-sitemap-${{ github.event.deployment.sha || github.sha }}
          restore-keys: |
            indexnow-sitemap-

      - name: Restore the previous production Notes sitemap
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4, verified 2026-10-28
        with:
          path: .cache/indexnow/notes-sitemap.xml
          key: indexnow-notes-sitemap-${{ github.event.deployment.sha || github.sha }}
          restore-keys: |
            indexnow-notes-sitemap-

      - name: Verify IndexNow configuration
        shell: bash
        run: |
          if [[ ! "$INDEXNOW_KEY" =~ ^[A-Za-z0-9-]{8,128}$ ]]; then
            echo "INDEXNOW_KEY must be configured as a GitHub Actions secret."
            exit 1
          fi

      - name: Submit canonical sitemap URLs
        shell: bash
        run: |
          node scripts/indexnow.mjs \
            --sitemap "https://www.suvroghosh.in/sitemap.xml?deployment=${{ github.event.deployment.sha || github.sha }}" \
            --previous-sitemap-file .cache/indexnow/sitemap.xml \
            --save-sitemap-file .cache/indexnow/sitemap.xml
          node scripts/indexnow.mjs \
            --sitemap "https://www.suvroghosh.in/notes/sitemap.xml?deployment=${{ github.event.deployment.sha || github.sha }}" \
            --previous-sitemap-file .cache/indexnow/notes-sitemap.xml \
            --save-sitemap-file .cache/indexnow/notes-sitemap.xml
