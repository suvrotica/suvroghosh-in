<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="postcard-title postcard-description">
	<title id="postcard-title">Two Calendars, One Life — 1943</title>
	<desc id="postcard-description">Two Calendars, One Life · 1943: a year in two worlds.

Calcutta / India — 1943: Hunger arrives in the city.

America — 1943: A ration book beside the shopping list.

Thematic comparison: Food allocation reached everyday life in both places in 1943, with profoundly unequal conditions. US rationing and Bengal’s famine are compared as questions of access and public responsibility; they are not equivalent experiences or a claim of direct causation.

http://127.0.0.1:4283/blog/visualizations/two-calendars-one-life?year=1943
Sources:
US Department of State, Office of the Historian: Memorandum from Wallace Murray to the War Commodities Division, 28 August 1943 — https://history.state.gov/historicaldocuments/frus1943v04/d337
Library of Congress: “Rationing Safeguards Your Share” — https://blogs.loc.gov/inside_adams/2020/04/rationing-ww2/
US Office of War Information / Library of Congress: Food rationing and the war (1943) — https://www.loc.gov/item/43051838/</desc>
