<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="msvalidate.01" content="42109724287F9B19E5AB5196F3C807BF" />
		<meta name="text-scale" content="scale" />
		<script>
			(() => {
				const root = document.documentElement;
				const preferences = ['system', 'light', 'dark', 'sepia'];
				let preference = 'sepia';

				try {
					const stored = window.localStorage.getItem('site-theme');
					if (stored && preferences.includes(stored)) preference = stored;
				} catch {
					// Keep the sepia default when browser storage is unavailable.
				}

				const resolved =
					preference === 'system'
						? window.matchMedia('(prefers-color-scheme: dark)').matches
							? 'dark'
							: 'light'
						: preference;

				root.dataset.theme = preference;
				root.classList.toggle('dark', resolved === 'dark');
				root.classList.toggle('theme-sepia', resolved === 'sepia');
				root.style.colorScheme = resolved === 'dark' ? 'dark' : 'light';
			})();
		</script>
		<script>
			// Responsive image requests can fail before Svelte hydrates (for example in a local
			// production preview or if the deploy-time optimiser is temporarily unavailable).
			// Capture that early error and retry the original asset immediately.
			document.addEventListener(
				'error',
				(event) => {
					const image = event.target;
					if (!(image instanceof HTMLImageElement)) return;
					const original = image.dataset.originalSrc;
					if (!original || image.dataset.originalFallback === 'true') return;

					image.dataset.originalFallback = 'true';
					// Preserve the server-rendered node tree until Svelte hydrates. Removing the
					// <source> here makes the hydrator encounter <img> where it expects <source>.
					image
						.closest('picture')
						?.querySelectorAll('source[data-responsive-image]')
						.forEach((source) => source.removeAttribute('srcset'));
					image.removeAttribute('srcset');
					image.src = original;
				},
				true
			);
		</script>
		<meta name="theme-color" content="#171717" />
		<link rel="icon" href="/favicon.ico" />
		<link rel="icon" href="/icon.svg" type="image/svg+xml" sizes="any" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
		<link rel="manifest" href="/site.webmanifest" />
		<link
			rel="alternate"
			type="application/rss+xml"
			title="SuvroGhosh.In"
			href="https://www.suvroghosh.in/rss.xml"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
