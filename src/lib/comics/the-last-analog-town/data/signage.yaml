schemaVersion: '1.0.0'
seriesId: 'the-last-analog-town'
status: 'canonical-working-copy'

policy:
  generatedArtworkText: 'No words, letters, numerals, logos, signatures or watermarks may be generated inside artwork.'
  compositionMethod: 'Draw or generate blank sign substrates in perspective, then compose reviewed text deterministically in the publishing pipeline.'
  sourceEncoding: 'UTF-8 Unicode'
  readingDirection: 'left-to-right'
  bengaliDefaultTranslationState: 'needs-human-review'
  publicationGate: 'Every Bengali string must have translationState: needs-human-review until a named competent reviewer records reviewer and reviewedAt. A null reviewer or date blocks publication.'
  reviewChecks:
    - 'meaning and tone against the English source'
    - 'spelling, conjuncts, vowel marks and punctuation'
    - 'natural Bengali rather than literal machine syntax, except where an intentionally awkward system message is flagged'
    - 'proper-name consistency'
    - 'font shaping at final display size'
    - 'line breaks, reading order and contrast in context'
  rendererRules:
    - 'Use only approved fonts with complete Bengali glyph coverage.'
    - 'Do not raster-stretch, mirror, outline-convert before review, or replace Bengali with decorative pseudo-script.'
    - 'Keep wording in this file, not in image prompts.'
    - 'Numerals shown on props, clocks or forms are deterministic overlays even when no translation is needed.'

