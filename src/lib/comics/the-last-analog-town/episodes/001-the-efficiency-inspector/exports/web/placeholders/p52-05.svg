<text x="100" y="205" font-family="system-ui,sans-serif" font-size="28" fill="#514b42">Page 52, panel 5 · Low wide shot on the utility lever and server-cupboard grille</text>
<text x="100" y="260" font-family="system-ui,sans-serif" font-size="28" fill="#514b42">ila-dastidar, riju-dhar, director-vale, cecil-c17</text>
