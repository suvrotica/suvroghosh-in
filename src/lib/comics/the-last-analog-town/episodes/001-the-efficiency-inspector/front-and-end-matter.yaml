productionEndMatter:
  heading: 'A complete illustrated production edition'
  publicEditionText: >-
    Album One is a complete self-contained illustrated story with final panel art and
    deterministic lettering. This edition remains unpublished while recorded rights,
    Bengali-language, cultural, accessibility, responsive-reader, print, EPUB and named final
    editorial approvals are completed.
  secondAlbumPromise: >-
    Golmohar's hybrid rules remain in force, and their new queues, appeals and arguments leave the
    town open to further standalone adventures without weakening this album's conclusion.
  hybridRulesHeading: 'The eleven binding operating conditions'
  hybridRules:
    - 'Algorithms may recommend, but must display uncertainty and known failure conditions.'
    - 'Unknown must be distinct from false.'
    - 'Consequential decisions require an accessible appeal and human recourse.'
    - 'Local-language explanations must be available.'
    - 'Citizens must be able to correct identity and address errors.'
    - 'Manual overrides must carry reasons and audit trails rather than trigger automatic punishment.'
    - 'No single score may decide healthcare, education, welfare, policing, or employment.'
    - 'Designers must observe actual work before digitising it.'
    - 'Informal practices must be evaluated individually rather than preserved or erased as a class.'
    - 'Public services must continue during network and power failure.'
    - 'Accuracy claims must be published beside known failure conditions.'

