      - id: p01-03-d02
        speaker: babul-courier
        text: 'There is less of it.'
        style: speech
        readingOrder: 2
        balloon:
          {
            x: 0.09,
            y: 0.21,
            width: 0.39,
            height: 0.13,
            z: 10,
            tailTarget: { x: 0.58, y: 0.43 },
            tailDirection: right,
            fontScale: 1
          }
    visualJoke: 'Riju must flatten himself against the improvement to let ordinary
      work pass.'
    continuity:
      - "The cycle van's bell remains on the left handlebar."
      - 'No contact dents the van or billboard support.'
    prompt:
      lighting: 'Alternating sun and hard billboard shade along the narrow vertical gap.'
