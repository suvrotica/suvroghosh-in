    aspectRatio: '4:3'
    camera: 'Waist-high medium shot beside the steel support'
    location: junction-square
    time: late morning
    characters:
      - {
          id: riju-dhar,
          position: centre,
          emotion: strained politeness,
          pose: 'Pointing from the support to a chalk relocation mark',
          facing: right
        }
    props: [ smart-town-billboard, riju-form-satchel ]
    foreground: 'A tape measure crosses a pothole and stops short of the chalk mark.'
    middleGround: 'Riju holds one palm up towards unseen installers and points with
      the other.'
    background: 'The blank billboard face towers over the municipal notice seams.'
    action: 'Riju asks for a small physical correction before the ceremony begins.'
    dialogue:
      - id: p01-02-d01
        speaker: riju-dhar
        text: 'Could we move the left support half a metre?'
        style: speech
        readingOrder: 1
        balloon:
          {
            x: 0.08,
            y: 0.06,
            width: 0.43,
            height: 0.16,
            z: 10,
            tailTarget: { x: 0.51, y: 0.54 },
            tailDirection: down,
            fontScale: 1
          }
      - id: p01-02-d02
        speaker: riju-dhar
        text: 'Twenty minutes till the ceremony.'
        style: speech
        readingOrder: 2
        balloon:
          {
            x: 0.55,
            y: 0.07,
            width: 0.38,
            height: 0.17,
            z: 10,
            tailTarget: { x: 0.34, y: 0.3 },
            tailDirection: down,
            fontScale: 0.95
          }
    visualJoke: 'The measured half-metre ends in an older, deeper pothole.'
    continuity:
      - 'The billboard support has not moved.'
      - "Riju's satchel strap crosses left shoulder to right hip."
    prompt:
      lighting: 'Direct warm sun with cool reflected shade from the blank billboard.'
      palette: 'Steel grey, chalk white, muted blue, moss green and dusty ochre.'
      composition: 'Keep Riju centre-low and the blank billboard mass behind him;
