    foreground: "Riju's oversized shoe overlaps the painted lane edge."
    middleGround: "The cycle van's cream mudguard passes the steel support by a
      finger's breadth."
    background: 'Traffic begins forming a slow reverse loop around the statue plinth.'
    action: 'Babul-da threads the van through while Riju makes himself part of the
