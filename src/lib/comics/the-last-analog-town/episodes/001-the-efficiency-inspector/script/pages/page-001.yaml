      balloonSafeAreas:
        [
          'upper-left reserve: x 0.06-0.52, y 0.04-0.24',
          'upper-right reserve: x 0.54-0.95, y 0.04-0.25'
        ]
      negative:
        [
          embedded dialogue or lettering,
          speech balloons,
          watermarks,
          signatures,
          copyrighted logos,
          extra limbs
        ]
    accessibility:
      alt: 'Riju politely points to a chalk mark beside the billboard support.'
      description: 'Riju asks unseen installers to shift the steel support before the
        ceremony. A tape measure reaches across a pothole to a chalk mark,
        revealing that the proposed correction has another physical problem.'
    art:
      {
        status: final,
