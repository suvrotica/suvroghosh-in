page: 1
title: 'Going forward, one lane at a time'
purpose: "Open on the album's central contradiction and give Riju an immediate
  practical problem."
location: junction-square
time: late morning
layout: 'A wide establishing tier, two medium beats, one small silent inset,
  then a wide page-turn panel.'
panelCount: 5
dialogueGoal: "Establish Riju's anxious need for a flawless launch and
  Babul-da's calm trust in improvised routes."
pageTurn: 'The Mission convoy appears at the far end of the lane the billboard
  has blocked.'
visualMotif: 'Clean forward arrows colliding with stubborn physical obstructions.'
continuity:
  - 'The smart-town billboard blocks one traffic lane; its deterministic overlay
    will read GOING FORWARD TOGETHER while generated art keeps the face blank.'
  - "Riju's temporary identity card visibly expires in four days; his pencil
    stays behind his right ear."
  - "Babul-da's blue-and-rust cycle van carries its cream replacement mudguard
    and left-handlebar bell."
panels:
  - id: p01-01
    panel: 1
    size: wide
    aspectRatio: '16:9'
    camera: 'High eye-level wide establishing shot down the two-lane square'
    location: junction-square
    time: late morning
    characters:
      - {
          id: riju-dhar,
          position: foreground-left,
          emotion: alarmed concentration,
          pose: 'Measuring the billboard support with both hands spread',
          facing: right
        }
      - {
          id: babul-courier,
          position: background-right,
          emotion: attentive calm,
          pose: 'Pedalling the loaded cycle van towards the narrowing lane',
          facing: left
        }
    props:
      [
        smart-town-billboard,
        riju-form-satchel,
        babul-cycle-van,
        junction-clock-faces
      ]
    foreground: "A freshly painted forward arrow ends against the billboard's thick
      steel foot."
    middleGround: 'Riju stands between the support and the usable strip of road, his
      satchel pushed behind him.'
    background: 'Junction Square layers awnings, the crooked clock and approaching
      everyday traffic around a broad blank billboard face.'
    action: "The new billboard physically removes one of the square's two usable
      lanes as Riju measures the mistake."
    dialogue: []
    visualJoke: 'The official forward arrow leads directly into the support.'
    continuity:
      - 'Leave the billboard face completely blank; title and slogan are
        deterministic overlays.'
      - "Riju's pencil remains behind his right ear and his temporary card is
        clipped to the vest."
    prompt:
      lighting: 'Warm humid late-morning light with hard-edged shade under the
        billboard.'
      palette: 'Faded municipal red, Grid blue, dusty cream, moss green and road grey.'
      composition: 'Strong left-to-right reading path from arrow to support to Riju to
        Babul-da; preserve a large clean billboard face and upper-right balloon
        reserve.'
      balloonSafeAreas:
        [
          'upper-right sky and billboard-edge reserve: x 0.63-0.96, y
            0.04-0.24'
        ]
      negative:
        [
          embedded dialogue or lettering,
          speech balloons,
          watermarks,
          signatures,
          copyrighted logos,
          extra limbs
        ]
    accessibility:
      alt: 'A smart-town billboard blocks one lane while Riju measures its support.'
      description: "In busy Junction Square, a painted arrow runs straight into the
        new billboard's steel foot. Riju anxiously measures the obstruction as
        Babul-da approaches on his loaded cycle van beneath the crooked civic
        clock."
    art:
      {
        status: final,
        revision: 1,
        source: panels/raw/page-001/p01-01__r1.png,
        final: panels/approved/page-001/p01-01__r1.png,
        width: 1672,
        height: 941
      }
  - id: p01-02
