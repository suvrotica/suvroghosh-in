    continuity:
      - "Babul-da lifts beneath the chassis, not by Cecil's head or stamp arm."
      - "Cecil's lower-left dent remains visible and no new damage occurs."
    prompt:
      lighting: 'Warm sun softened by billboard shade across both figures.'
      palette: 'Ochre, indigo, cream enamel, muted blue and road grey.'
      composition: "Balance Babul-da's broad human silhouette against Cecil's compact
