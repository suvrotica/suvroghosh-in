      balloonSafeAreas:
        [
          'upper-right reserve: x 0.45-0.97, y 0.02-0.21',
          'second-tier left reserve: x 0.05-0.36, y 0.20-0.39'
        ]
      negative:
        [
          embedded dialogue or lettering,
          speech balloons,
          watermarks,
          signatures,
          copyrighted logos,
          extra limbs
        ]
    accessibility:
      alt: 'Babul-da lifts Cecil free while the robot formally objects.'
      description: "Babul-da braces his boots and lifts Cecil's chassis just clear of
