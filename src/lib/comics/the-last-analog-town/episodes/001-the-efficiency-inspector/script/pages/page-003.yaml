page: 3
title: "Everybody's improvement"
purpose: 'Show why Golmohar genuinely wants the Mission and establish competing
  local hopes.'
location: junction-square
time: midday
layout: 'Wide civic-stage opener above four brisk medium/small constituency
  beats and a wide question-led turn.'
panelCount: 6
dialogueGoal: 'Give Ila economical public optimism, Vale credible commitments
  and Riju a private reminder of his expiring job.'
pageTurn: "Vale asks Riju to show the system that made Golmohar's application
  appear complete."
visualMotif: 'Several official openings competing around one practical promise.'
continuity:
  - 'Ila carries the municipal red ledger under her left arm and her cracked
    phone in the right overshirt pocket.'
  - 'All banners and ribbon cards remain blank in generated art.'
  - "Riju's temporary badge and private four-day deadline remain visible."
