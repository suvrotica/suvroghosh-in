    foreground: 'Three blank paper records overlap without aligning.'
    middleGround: 'Riju opens the thick-bezel terminal between Ila and the inspectors.'
    background: 'The square continues working beyond the demonstration, with the
      billboard face still blank.'
    action: 'Riju begins a live reconciliation using three conflicting records for
      one resident.'
    dialogue:
      - id: p04-01-d01
        speaker: riju-dhar
        text: 'These records don''t agree.'
        style: speech
        readingOrder: 1
        balloon:
