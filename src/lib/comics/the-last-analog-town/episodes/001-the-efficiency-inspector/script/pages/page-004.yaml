            x: 0.15,
            y: 0.01,
            width: 0.13,
            height: 0.27,
            z: 10,
            tailTarget: { x: 0.355, y: 0.21 },
            tailDirection: down,
            fontScale: 1,
            manualBreaks: [ 'These records', 'don''t agree.' ]
          }
      - id: p04-01-d02
        speaker: riju-dhar
        text: 'I''ll show you where.'
        style: speech
        readingOrder: 2
        balloon:
          {
            x: 0.42,
            y: 0.01,
            width: 0.19,
            height: 0.20,
            z: 10,
            tailTarget: { x: 0.355, y: 0.21 },
            tailDirection: left,
            fontScale: 1
          }
