      [
        "Riju's pencil is in his hand, leaving the right-ear position visibly
          empty.",
        'Terminal interface and all paper writing remain blank for
          composition.'
      ]
    prompt:
      {
        lighting: 'Warm early-afternoon light under a patched awning.',
        palette: 'Moss green, municipal red, Grid silver, cream paper and terminal
