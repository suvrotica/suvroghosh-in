page: 4
title: 'The Civic Crosswalk'
purpose: "Introduce Riju's invention and prove that it can recover a real
  exclusion without pretending probability is identity."
location: junction-square
time: early afternoon
layout: 'Wide demonstration opener, two medium technical beats, a tight
  challenge, and a wide invitation turn.'
panelCount: 5
dialogueGoal: 'Let Riju explain through a live case, Cecil quantify uncertainty
  and Vale ask who may convert probability into civic fact.'
pageTurn: 'Vale invites Riju and the Crosswalk into the official inspection.'
visualMotif: 'Three misaligned records briefly forming one readable human outline.'
continuity:
  - "Riju's refurbished reconciliation terminal has one replaced blue key and a
    left-side battery lead."
  - 'All record cards, names, figures and interface text are deterministic
    overlays on blank generated screens.'
  - 'The resident case is represented visually but receives no dialogue until a
    canonical supporting ID exists.'
panels:
  - id: p04-01
    panel: 1
    size: wide
    aspectRatio: '16:9'
    camera: 'Eye-level wide shot across the temporary demonstration desk'
    location: junction-square
    time: early afternoon
    characters:
      - {
          id: riju-dhar,
          position: centre-left,
          emotion: energised focus,
          pose: 'Opening the terminal and arranging three blank record cards',
          facing: right
        }
      - {
          id: director-vale,
          position: centre-right,
          emotion: attentive curiosity,
          pose: 'Standing upright with tablet held low',
          facing: left
        }
      - {
          id: cecil-c17,
          position: right,
          emotion: analytical readiness,
          pose: 'Head angled towards the terminal',
          facing: left
        }
      - {
          id: ila-dastidar,
          position: left,
          emotion: guarded pride,
          pose: 'Watching over her ledger',
          facing: right
        }
    props:
      [
        riju-reconciliation-terminal,
        riju-form-satchel,
        vale-silver-tablet,
        cecil-stamp-arm,
        municipal-red-ledger
