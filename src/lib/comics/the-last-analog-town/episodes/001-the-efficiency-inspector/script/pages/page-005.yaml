          id: ila-dastidar,
          position: left,
          emotion: contained wariness,
          pose: 'Taking the chair with ledger under her arm',
          facing: right
        }
      - {
          id: director-vale,
          position: centre,
          emotion: professional assurance,
          pose: 'Standing beside the long table with tablet ready',
          facing: left
        }
      - {
          id: riju-dhar,
          position: right,
          emotion: alert anticipation,
          pose: 'Setting his terminal on a side desk',
          facing: left
        }
      - {
          id: cecil-c17,
          position: far-right,
          emotion: awaiting agenda,
          pose: 'Aligned square with the table edge',
          facing: left
