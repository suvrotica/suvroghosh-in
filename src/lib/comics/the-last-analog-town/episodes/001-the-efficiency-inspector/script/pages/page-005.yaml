page: 5
title: 'The condition inside the grant'
purpose: "Bind the town's funding and Riju's permanent-post hope to a live
  integration accepted through weak consent."
location: golmohar-municipal-hall
time: afternoon
layout: 'Wide room establishment, two opposed medium reveals, one silent close
  reaction, and a wide contractual turn.'
panelCount: 5
dialogueGoal: "Make Vale's terms transparent, Riju's hope concrete and Ila's
  objection about meaningful consent precise."
pageTurn: 'Vale announces that the inspection begins with the building around them.'
visualMotif: 'A small digital clause unfolding into a physically enormous condition.'
continuity:
  - 'Riju has packed the terminal from page 4 and keeps the temporary card
    visible.'
  - "Ila's red ledger contains the paper copy of Golmohar's earlier application."
  - 'All contract, tablet and phone text is added during deterministic
    composition.'
