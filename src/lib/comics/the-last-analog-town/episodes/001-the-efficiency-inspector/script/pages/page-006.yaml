page: 6
title: 'One hall, seven buildings'
purpose: "Establish Municipal Hall as a physical and database contradiction that
  carries the album's later utility crisis."
location: golmohar-municipal-hall
time: afternoon
layout: 'Wide architectural opener followed by four vertical/medium discovery
  beats and a wide service-counter turn.'
panelCount: 6
dialogueGoal: "Contrast Riju's confidence, Ila's working memory and Vale's
  concern that a stranger cannot safely rely on either."
pageTurn: 'A grievance claimant is redirected from the so-called single window
  to the public grievance counter.'
visualMotif: 'One public institution repeatedly splitting into incompatible
  numbered layers.'
continuity:
  - 'The server cupboard, generator shed and conflicting property identities are
    established for pages 19 and 52.'
  - 'All plaques, account numbers and service labels remain blank for
    deterministic lettering.'
  - 'Cecil counts seven probable property identities without choosing one.'
