    size: wide
    aspectRatio: '16:9'
    camera: 'Eye-level wide shot across the grievance counter and queue'
    location: golmohar-municipal-hall
    time: late afternoon
    characters:
      - {
          id: ila-dastidar,
          position: left,
          emotion: familiar impatience,
          pose: 'Reading the counter screen over her spectacles',
          facing: right
        }
      - {
          id: riju-dhar,
          position: centre,
          emotion: puzzled concentration,
          pose: "Holding the claimant's blank form beside the terminal",
          facing: right
        }
      - {
          id: director-vale,
          position: right,
          emotion: analytical concern,
          pose: "Watching the claimant's route on the tablet",
          facing: left
        }
      - {
          id: cecil-c17,
          position: far-right,
          emotion: rule retrieval,
          pose: 'Stamp arm poised over the token drum',
          facing: left
        }
    props:
      [
        municipal-red-ledger,
        ila-cracked-phone,
        riju-reconciliation-terminal,
        vale-silver-tablet,
        cecil-stamp-arm,
        grievance-token-drum
