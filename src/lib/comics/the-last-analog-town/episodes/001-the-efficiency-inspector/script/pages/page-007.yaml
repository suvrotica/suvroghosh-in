page: 7
title: 'The complaint before the complaint'
purpose: "Show both the circular formal grievance route and the unequal reach of
  Ila's personal shortcut."
location: golmohar-municipal-hall
time: late afternoon
layout: 'Wide counter opener, a medium rule reveal, two opposed
  intervention/reaction beats, and a wide ethical page turn.'
panelCount: 5
dialogueGoal: 'Argue about who actually receives recourse rather than whether
  forms or personal intervention are inherently foolish.'
pageTurn: 'Vale asks how an ambulance finds somebody whose complaint system
  cannot find them.'
visualMotif: 'A grievance token travelling in a circle while people stand still.'
continuity:
  - 'The claimant from page 6 reaches the grievance counter.'
  - 'The portal requires a complaint number generated only after submission.'
  - "Ila's phone intervention helps one case while another resident without
    access remains waiting."
panels:
