    visualJoke: 'The three-step poster has enough correction layers for eleven steps.'
    continuity:
      [
        'All forms, screens, tokens and poster words remain blank in generated
          art.',
        'Ila wears spectacles for close reading in this panel.'
      ]
    prompt:
      {
