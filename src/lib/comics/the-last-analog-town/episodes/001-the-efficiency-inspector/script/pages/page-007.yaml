            width: 0.27,
            height: 0.15,
            z: 10,
            tailTarget: { x: 0.64, y: 0.25 },
            tailDirection: down,
            fontScale: 0.96,
            manualBreaks: [ 'It wants the', 'complaint number.' ]
          }
      - id: p07-01-d02
        speaker: ila-dastidar
        text: 'This is the complaint.'
        style: speech
        readingOrder: 2
        balloon:
          {
            x: 0.28,
            y: 0.45,
            width: 0.31,
            height: 0.14,
            z: 10,
            tailTarget: { x: 0.515, y: 0.31 },
            tailDirection: up,
            fontScale: 1
