page: 8
title: 'Turn left where the cinema used to be'
purpose: 'Make landmark addresses simultaneously legible, useful and unsafe for
  strangers.'
location: junction-square
time: late afternoon
layout: 'Wide travelling opener, two comic navigation beats, a sober medium
  reversal, and a busy wide address turn.'
panelCount: 5
dialogueGoal: 'Let Babul-da explain routes as social chains while Vale names the
  real emergency cost.'
pageTurn: 'Cecil discovers that a resident at the landmark exists as three
  separate people.'
visualMotif: 'A remembered landmark remaining fixed while the buildings around it change.'
continuity:
  - 'The route begins outside Municipal Hall and loops through lanes still
    treated as the Junction Square location.'
  - 'The old cinema is gone but remains the shared directional anchor.'
  - 'The pond-road mismatch is visible and persists into later map and flood
    sequences.'
