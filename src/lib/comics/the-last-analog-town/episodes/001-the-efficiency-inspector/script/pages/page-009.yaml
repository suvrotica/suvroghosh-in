page: 9
title: 'One person, three absences'
purpose: 'Prove that careful reconciliation can expand access before showing its
  coercive potential.'
location: junction-square
time: early evening
layout: 'Wide service-desk opener, four alternating technical and human close
  beats, and a wide activation turn.'
panelCount: 6
dialogueGoal: 'Give Riju an earned success while Vale insists that the resident
  must review the proposed merge.'
pageTurn: 'The successful correction raises the Mission dashboard enough to
  trigger the live-trial notice.'
visualMotif: 'Three empty chairs collapsing into one occupied place without
  erasing the source chairs.'
continuity:
  - 'The resident from page 8 has three spellings and address forms across
    postal, welfare and electoral sources.'
  - 'The three sources remain visible and are not destructively overwritten.'
  - 'All names, scores and benefit details are deterministic overlays.'
panels:
