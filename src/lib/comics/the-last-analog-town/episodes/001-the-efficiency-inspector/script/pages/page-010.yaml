page: 10
title: 'The town has already agreed'
purpose: 'Complete the opening movement with a constrained but genuine civic choice.'
location: golmohar-municipal-hall
time: evening
layout: 'Wide council opener, three tightening choice panels, and a wide stamped
  page-turn.'
panelCount: 5
dialogueGoal: "Make Ila's acceptance politically plausible, Vale's process
  explicit and Riju's volunteered responsibility unmistakable."
pageTurn: 'Vale opens the inspection itinerary at Rook Clinic for dawn.'
visualMotif: 'The word voluntary pressed onto a form whose consequences already
  fill the room.'
continuity:
  - 'The live-trial alert from page 9 activates a seventy-two-hour countdown.'
  - 'Refusal remains possible but pauses the first funding tranche and permanent
    systems post.'
  - 'Ila secures a public review before signing the limited activation.'
panels:
