    continuity:
      [
        'All countdown figures and form text are deterministic overlays.',
        'Ila wears spectacles only for the contract review.'
      ]
    prompt:
      {
        lighting: 'Warm council lamps against cool evening windows.',
        palette: 'Ledger red, graphite, moss green, cream enamel and muted Grid blue.',
