    size: wide
    aspectRatio: '16:9'
    camera: 'Wide council-table shot with the activation alert projected as blank
      geometry'
    location: golmohar-municipal-hall
    time: evening
    characters:
      - {
          id: director-vale,
          position: centre,
          emotion: formal clarity,
          pose: 'Standing at the head of the table with tablet turned outward',
          facing: front
        }
      - {
          id: ila-dastidar,
          position: left,
          emotion: guarded calculation,
          pose: 'Seated with ledger open and spectacles on',
          facing: right
        }
      - {
          id: riju-dhar,
          position: right,
          emotion: anxious readiness,
          pose: 'Sitting beside the open terminal',
          facing: left
        }
      - {
          id: cecil-c17,
          position: far-right,
          emotion: countdown monitoring,
          pose: 'Stamp arm beside a blank activation form',
          facing: left
        }
    props:
