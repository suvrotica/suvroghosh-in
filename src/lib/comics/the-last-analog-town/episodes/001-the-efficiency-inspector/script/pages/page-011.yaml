page: 11
title: 'Two queues and one emergency'
purpose: "Introduce Ananya's humane but unaudited triage and the real safety
  question Vale raises."
location: rook-clinic
time: dawn
layout: 'Wide clinic opener, two alternating queue panels, a tight ethical
  exchange, and a wide scanner turn.'
panelCount: 5
dialogueGoal: 'Let Ananya defend urgency without calling the queue fair, and let
  Vale ask how a stranger could reproduce her sound decision.'
pageTurn: 'The Mission biometric check-in rejects the next patient.'
visualMotif: 'A red urgency clip moving against a frozen digital order.'
continuity:
  - 'The clinic paper queue and digital appointment list visibly disagree.'
  - "Ananya's mechanical watch stays on her left wrist, tool bag remains within
    reach and amber frames stay circular."
  - 'The urgent patient is treated with gravity; no joke targets illness.'
