page: 12
title: 'Hands the scanner cannot read'
purpose: 'Expose physical and infrastructural failure conditions in supposedly
  universal identity.'
location: rook-clinic
time: morning
layout: 'Tight rejection opener, four investigative beats crossing hand, glass
  and power, then a wide propagation turn.'
panelCount: 6
dialogueGoal: 'Make the scanner failure a property of conditions and design, not
  of the people it rejects.'
pageTurn: 'Low-confidence flags appear simultaneously in clinic, welfare and
  market data.'
visualMotif: 'A human hand remaining clear while its digital outline repeatedly fades.'
continuity:
  - 'The rejected hand belongs to a manual worker with worn fingerprints; the
    depiction is respectful.'
  - 'Damp glass, voltage fluctuation and physical wear each contribute to
    failure.'
  - 'Riju enables manual verification, which downstream systems mark as lower
    confidence.'
panels:
  - id: p12-01
    panel: 1
    size: medium
    aspectRatio: '4:3'
    camera: 'Tight over-scanner view of a rejected hand'
    location: rook-clinic
    time: morning
    characters:
      - {
          id: riju-dhar,
          position: left,
          emotion: puzzled urgency,
          pose: 'Holding a clean cloth near the scanner without touching the hand',
          facing: right
        }
      - {
          id: cecil-c17,
          position: right,
          emotion: repeated verification,
          pose: 'Optical shutters fixed on the blank failure indicator',
          facing: left
        }
    props: [ riju-form-satchel, cecil-stamp-arm ]
    foreground: 'A work-worn hand rests correctly on damp scanner glass.'
    middleGround: 'The blank identity outline fails to complete.'
    background: 'Riju and Cecil watch the repeated rejection.'
    action: 'The patient presents the same hand correctly and is rejected again.'
    dialogue:
      - id: p12-01-d01
        speaker: riju-dhar
        text: 'It''s not reading the print.'
        style: speech
        readingOrder: 1
        balloon:
          {
            x: 0.48,
            y: 0.02,
            width: 0.48,
            height: 0.14,
            z: 10,
            tailTarget: { x: 0.27, y: 0.23 },
            tailDirection: down,
            fontScale: 0.95
          }
    continuity:
      [
        'No generated error words appear.',
        "The patient's hand anatomy is natural and undistorted."
      ]
    prompt:
      {
        lighting: 'Cool scanner light on the hand with warm clinic fill.',
        palette: 'Warm brown skin, blue-grey scanner, moss green and cream enamel.',
        composition: 'Hand and damp glass dominate foreground; Riju and Cecil read
          behind; reserve upper-left.',
        balloonSafeAreas: [ 'upper-left reserve: x 0.03-0.49, y 0.03-0.21' ],
        negative:
          [
            embedded dialogue or lettering,
            speech balloons,
            watermarks,
            signatures,
            copyrighted logos,
            extra limbs
          ]
      }
    accessibility:
      {
        alt: 'A biometric scanner rejects a correctly placed work-worn hand.',
        description: "A manual worker's hand rests properly on damp scanner glass, but
          the blank identity outline fails to complete. Riju and Cecil watch the
          second rejection."
      }
    art:
      {
        status: final,
        revision: 1,
        source: panels/raw/page-012/p12-01__r1.png,
        final: panels/approved/page-012/p12-01__r1.png,
        width: 1448,
        height: 1086
      }
