page: 13
title: 'The price of knowing the customer'
purpose: 'Present market pricing as expertise, obligation and possible exclusion
  rather than picturesque disorder.'
location: twelve-hand-market
time: late morning
layout: 'Dense wide market opener, three medium comparisons and a wide proposal turn.'
panelCount: 5
dialogueGoal: 'Allow merchants to understand conditions the model misses while
  admitting that opacity can exploit outsiders.'
pageTurn: 'Vale offers a forecasting tool that appears able to preserve
  bargaining while exposing ranges.'
visualMotif: 'Several price surfaces changing at different speeds around the same basket.'
continuity:
  - 'Price slates and payment placards contain no generated writing.'
  - 'Freshness, weather, bargaining, debt and social obligation are all visible
    pricing factors.'
  - "The market's patch of reliable signal is established for page 14."
