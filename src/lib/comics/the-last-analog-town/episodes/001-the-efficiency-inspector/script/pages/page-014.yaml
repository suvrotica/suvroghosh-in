page: 14
title: 'A forecast, not a fixed price'
purpose: 'Plant the market feedback loop while making adoption useful and
  voluntary at first.'
location: twelve-hand-market
time: midday
layout: 'Wide installation panel, three brisk benefit/reaction beats, a two-shot
  warning, and a wide station-led turn.'
panelCount: 6
dialogueGoal: 'Establish the recommendation as advisory, then seed that
  publishing a forecast changes behaviour.'
pageTurn: 'A station bell sends the inspection running towards a train that is
  not yet there.'
visualMotif: 'An advisory range gradually becoming the brightest object in the market.'
continuity:
  - 'The forecast display uses weather, arrival and stock inputs and remains
    advisory.'
  - 'All display, price and payment text is deterministic lettering on blank
    generated surfaces.'
  - "The merchant's behavioural warning is recorded but not resolved."
panels:
  - id: p14-01
    panel: 1
    size: wide
    aspectRatio: '16:9'
    camera: 'Wide eye-level shot of the voluntary forecast display being fitted'
    location: twelve-hand-market
    time: midday
    characters:
      - {
          id: riju-dhar,
          position: centre-left,
          emotion: inventive concentration,
          pose: 'Connecting terminal leads to a broad blank display',
          facing: right
        }
      - {
          id: cecil-c17,
          position: centre-right,
          emotion: input verification,
          pose: 'Indexing stock and weather inputs with stamp arm',
          facing: left
        }
      - {
          id: director-vale,
          position: left,
          emotion: supervisory approval,
          pose: 'Reviewing the blank opt-in record',
          facing: right
        }
      - {
          id: babul-courier,
          position: right,
          emotion: cautious interest,
          pose: 'Holding a router basket above shoulder height',
          facing: left
        }
    props:
      [
        riju-reconciliation-terminal,
        cecil-stamp-arm,
        vale-silver-tablet,
        babul-cycle-van,
        market-price-slates,
        competing-payment-placards
      ]
    foreground: 'Loose cable runs from terminal to a blank display above the stall.'
    middleGround: 'Riju and Cecil connect weather, stock and arrival inputs.'
    background: "Babul-da raises the router towards the market's narrow signal patch."
    action: 'The market installs a voluntary recommendation range without replacing
      the price slates.'
    dialogue:
      - id: p14-01-d01
        speaker: riju-dhar
        text: 'It''s advisory. The seller still decides.'
        style: speech
        readingOrder: 1
        balloon:
          {
            x: 0.04,
            y: 0.49,
            width: 0.30,
            height: 0.15,
            z: 10,
            tailTarget: { x: 0.325, y: 0.350 },
            tailDirection: up,
            fontScale: 0.92,
            manualBreaks: [ 'It''s advisory.', 'The seller still decides.' ]
          }
    visualJoke: 'The stable-network indicator depends on Babul-da holding a router
      above a basket.'
    continuity:
      [
        'Display face and all placards remain blank.',
        "Babul-da's cycle van stays parked within reach."
      ]
    prompt:
      {
        lighting: 'Bright midday strips through awnings with cool display reflections.',
        palette: 'Slate grey, moss green, cream enamel, graphite, ochre and muted blue.',
        composition: 'Blank display high-centre, Riju and Cecil below, Babul-da raising
          router at right; reserve upper-centre.',
        balloonSafeAreas: [ 'upper-centre reserve: x 0.24-0.70, y 0.03-0.21' ],
        negative:
          [
            embedded dialogue or lettering,
            speech balloons,
            watermarks,
            signatures,
            copyrighted logos,
            extra limbs
          ]
      }
    accessibility:
      {
        alt: 'Riju connects a blank market forecast display while Babul-da raises the
