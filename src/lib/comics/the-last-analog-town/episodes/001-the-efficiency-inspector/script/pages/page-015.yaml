page: 15
title: 'The aspirational timetable'
purpose: 'Show a service where honest prediction is immediately and
  unambiguously useful.'
location: golmohar-halt
time: early afternoon
layout: 'Wide station opener, three escalating clock/platform comparisons, and a
  wide accurate-arrival turn.'
panelCount: 5
dialogueGoal: 'Distinguish a timetable promise from a useful uncertainty range
  and give Riju a deserved technical success.'
pageTurn: 'Cecil finds a railway passenger simultaneously listed at School No. 3.'
visualMotif: 'Two clocks disagreeing while a dog responds to the physical railway.'
continuity:
  - 'Golmohar Halt has one operational line, an unfinished second platform and
    two disagreeing clocks.'
  - "Ghori's behaviour follows rail vibration and routine, not supernatural
    intelligence."
  - 'All clock numerals, signboard text and announcements are deterministic
    overlays.'
