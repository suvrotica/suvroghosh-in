page: 16
title: 'Attendance, displacement, and one goat'
purpose: 'Introduce school-record complexity and the danger of prediction
  hardening temporary conditions into destiny.'
location: golmohar-school-3
time: afternoon
layout: 'Wide courtyard/classroom opener, two record-comparison beats, a goat
  reveal, and a wide predictive turn.'
panelCount: 5
dialogueGoal: 'Let the school want better records while rejecting permanent
  conclusions drawn from flood displacement and incomplete facilities.'
pageTurn: "A predicted infrastructure career points the inspection towards the
  New Development's missing drainage."
visualMotif: 'Three registers holding different valid states while one
  prediction compresses them.'
continuity:
  - 'Maroon attendance, green flood-displacement and blue election registers
    retain fixed roles.'
  - 'Roll Forty-Seven is a small black-and-brown goat with white forehead mark
    and red rope collar.'
  - 'The shared laboratory remains limited and partly locked; no joke targets
    displaced children.'
