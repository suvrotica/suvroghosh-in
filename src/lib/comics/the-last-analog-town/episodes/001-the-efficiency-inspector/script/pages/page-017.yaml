page: 17
title: 'Smart above, unfinished below'
purpose: 'Expose prestige infrastructure, plant the genuine contractor fraud and
  let Vale insist on physical verification.'
location: new-development
time: late afternoon
layout: 'Wide gate-and-tower opener, four descending
  surveillance/drainage/evidence beats, and a wide political turn.'
panelCount: 6
dialogueGoal: "Make Vale the first to privilege observed infrastructure over a
  clean dashboard and show Ila's discomfort with a connected contractor."
pageTurn: 'The completion certificates trace to a municipal map showing a road
  across the surviving pond.'
visualMotif: 'Perfect geometric systems mounted above unfinished, waterlogged foundations.'
continuity:
  - 'The New Development has working access control and surveillance but absent
    pumps, blocked drainage and a road ending in mud.'
  - 'A blank surveillance camera is physically hidden behind a blank political
    banner area.'
  - 'All certificates, plaques, billboards and interfaces remain blank for
    deterministic composition.'
