page: 18
title: 'The machine behind the machines'
purpose: 'Establish the Old Exchange as an essential offline fallback whose
  resilience and hazards both matter.'
location: old-exchange
time: early evening
layout: 'Wide exchange opener, three alternating dependency/risk beats, and a
  comic wide incoming-call turn.'
panelCount: 5
dialogueGoal: 'Let Ananya distinguish useful maintainable redundancy from
  nostalgia while Vale insists that working infrastructure still needs safety
  and access.'
pageTurn: 'An exchange line rings from a municipal room absent from every
  current building plan.'
visualMotif: 'A modern service signal travelling through visible plugs, cords
  and handwritten custody.'
continuity:
  - 'The Old Exchange retains four circuit books, colour-family patch cords and
    limited battery support.'
  - 'Patch-cord positions change only through visible, purposeful moves.'
  - 'The access list is useful but incomplete; no old system is treated as
    infallible.'
