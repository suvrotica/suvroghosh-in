page: 19
title: 'The map cabinet'
purpose: 'Reveal that Golmohar has no single broken record but many
  purpose-built realities.'
location: golmohar-municipal-hall
time: evening
layout: 'A wide archive opener, three forensic map comparisons, a bright
  Crosswalk proposal, and a narrow categorical turn.'
panelCount: 6
dialogueGoal: 'Move Riju from a clever demonstration to an ambitious civic
  design while Ila explains that every map answers a different political
  question.'
pageTurn: 'Cecil reports that the town itself has seven incompatible entity types.'
visualMotif: 'Transparent civic boundaries accumulate without ever settling into
  one authoritative outline.'
continuity:
  - 'All seven source maps remain intact and identifiable by colour and physical
    format; none is corrected or discarded.'
  - 'The utility register omits the occupied Hall service premises despite
    active demand; separately, the internal building plan omits the live server
    cupboard.'
  - 'The first Old Exchange circuit book rests safely beside the map cabinet
    after the return from page 18.'
