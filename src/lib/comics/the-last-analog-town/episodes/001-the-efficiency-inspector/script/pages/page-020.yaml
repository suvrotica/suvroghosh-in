page: 20
title: 'What kind of thing is Golmohar?'
purpose: "Use Cecil's categorical intelligence to articulate the design problem
  without turning Cecil human."
location: golmohar-municipal-hall
time: night
layout: 'A wide server test, a tall seven-type cascade, two close design
  consequences, and a wide stamped offer.'
panelCount: 5
dialogueGoal: 'Make precise that technical compatibility can conceal
  incompatible meanings rather than resolve them.'
pageTurn: 'Vale offers Riju the integration lead role and states the completion
  threshold.'
visualMotif: 'Seven neat system categories compete for one stubbornly irregular place.'
continuity:
  - 'The seven source-derived candidates remain separate inside the temporary
    composite entity.'
  - "Cecil's blue status light signals processing only; Cecil remains entirely
    procedural."
  - 'The source maps stay intact in the adjoining archive room, and the live
    server cupboard remains absent from the utility map.'
panels:
  - id: p20-01
    panel: 1
    size: wide
    aspectRatio: '16:9'
    camera: 'Wide shot from inside the cramped server cupboard towards the archive
      doorway'
    location: golmohar-municipal-hall
    time: night
    characters:
      - {
          id: cecil-c17,
          position: centre,
          emotion: categorical processing,
          pose: 'Connected to the reconciliation terminal by a blue service lead with
            stamp arm retracted',
          facing: front
        }
      - {
          id: riju-dhar,
          position: left,
          emotion: intent anticipation,
          pose: 'Crouching beside the terminal with pencil behind his right ear',
          facing: right
        }
      - {
          id: director-vale,
          position: right,
          emotion: exacting observation,
          pose: 'Standing at the cupboard threshold with silver tablet in left hand',
          facing: left
        }
    props:
      [
        cecil-stamp-arm,
        riju-reconciliation-terminal,
        riju-form-satchel,
        vale-silver-tablet,
        server-closet-table-fan
      ]
    foreground: 'Seven blank source cards enter the test in separate slots.'
    middleGround: "Cecil processes their type fields through Riju's refurbished terminal."
    background: 'The archive table and untouched map stack remain visible through
      the open doorway.'
    action: "Cecil runs Golmohar Junction through the Mission's accepted entity
      categories without combining the source meanings."
    dialogue:
      - id: p20-01-d01
        speaker: cecil-c17
        text: 'Town-level entity test initiated.'
        style: robot
        readingOrder: 1
        balloon:
          {
            x: 0.05,
            y: 0.03,
            width: 0.46,
            height: 0.14,
            z: 10,
            tailTarget: { x: 0.51, y: 0.49 },
            tailDirection: down,
            fontScale: 0.96
          }
      - id: p20-01-d02
        speaker: director-vale
        text: 'Use all of them.'
        style: speech
        readingOrder: 2
        balloon:
          {
            x: 0.55,
            y: 0.19,
            width: 0.23,
            height: 0.14,
            z: 10,
            tailTarget: { x: 0.85, y: 0.47 },
            tailDirection: up,
            fontScale: 1
          }
    continuity:
      [
        "Riju's pencil is back behind his right ear.",
        'The table fan oscillates slightly right in this panel.'
      ]
    prompt:
      {
        lighting: 'Cold server light inside the cupboard with warm archive spill through
          the doorway.',
        palette: 'Grid blue, cream enamel, moss, graphite, paper cream and municipal
          red.',
        composition: "Seven blank cards lead towards centred Cecil and Riju's terminal;
          Vale frames the right threshold; archive evidence remains visible;
          reserve upper-centre and upper-right.",
        balloonSafeAreas:
          [
            'upper-centre reserve: x 0.28-0.75, y 0.03-0.21',
            'upper-right reserve: x 0.73-0.97, y 0.03-0.20'
          ],
        negative:
          [
            embedded dialogue or lettering,
            speech balloons,
            watermarks,
            signatures,
            copyrighted logos,
            extra limbs,
            pseudo-Bengali glyphs
          ]
      }
    accessibility:
      {
        alt: "Cecil tests seven source cards beside Riju's terminal as Vale observes.",
        description: "Inside the cramped server cupboard, seven blank source cards enter
          separate slots. Cecil processes them through Riju's terminal while
          Vale insists that every source be included and the original maps
          remain visible in the archive."
      }
    art:
      {
        status: final,
        revision: 1,
        source: panels/raw/page-020/p20-01__r1.png,
        final: panels/approved/page-020/p20-01__r1.png,
        width: 1672,
        height: 941
      }
