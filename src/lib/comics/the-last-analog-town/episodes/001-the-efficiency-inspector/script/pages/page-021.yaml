page: 21
title: 'Ninety-eight per cent'
purpose: "Sharpen Riju's personal incentive and make the coming mistake understandable."
location: golmohar-municipal-hall
time: night
layout: 'A wide threshold briefing, a conditional two-shot, a silent badge
  close-up, a warning exchange, a decision panel, and a cold calculation turn.'
panelCount: 6
dialogueGoal: 'Let Vale defend a standard against sloppy migration while Riju
  conceals how much the permanent post matters and volunteers for the deadline.'
pageTurn: 'Cecil calculates that honest resolution currently stands far below
  the threshold.'
visualMotif: 'A target measured to absurd precision presses against a clock
  incapable of showing precise time.'
continuity:
  - 'The live-integration target is locked at ninety-eight per cent resolved.'
  - 'Vale improperly promises Riju the direct permanent systems appointment,
    conditional only on successful honest delivery.'
  - "Riju's temporary badge expires at 08:00 on the morning after the trial."
