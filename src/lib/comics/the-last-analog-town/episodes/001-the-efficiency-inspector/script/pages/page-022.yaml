page: 22
title: 'The reconciliation drive'
purpose: 'Compress labour, travel, and rising pressure into a causal build sequence.'
location: golmohar-municipal-hall
time: overnight
layout: 'A wide operations opener, three travelling work beats, and a wide
  dashboard stop.'
panelCount: 5
dialogueGoal: "Make data work physical and social while Riju's confidence
  tightens into deadline pressure."
pageTurn: 'The dashboard stops at the unresolved cases that matter most.'
visualMotif: 'Verified bundles move rightward while the red-marked anomaly file
  grows leftward.'
continuity:
  - 'The team works through Municipal Hall, Rook Clinic, the Twelve-Hand Market,
    Golmohar Halt, School No. 3, and Junction Square overnight.'
  - 'Every match retains its source record; the anomaly ledger begins as a
    visible red-marked working file.'
  - "Riju's temporary badge, pencil, satchel, and replaced blue terminal key
    remain visible through the night."
panels:
  - id: p22-01
    panel: 1
    size: wide
    aspectRatio: '16:9'
    camera: 'High wide shot across the archive room and open server cupboard'
    location: golmohar-municipal-hall
    time: late evening
    characters:
      - {
          id: riju-dhar,
          position: centre,
          emotion: focused confidence,
          pose: 'Feeding paired source cards into the reconciliation terminal',
          facing: right
        }
      - {
          id: cecil-c17,
          position: right,
          emotion: rapid procedural processing,
          pose: 'Stamp arm cycling over verified bundles',
          facing: left
        }
      - {
          id: director-vale,
          position: left,
          emotion: exacting approval,
          pose: 'Assigning staff from the silver tablet',
          facing: right
        }
    props:
      [
        riju-reconciliation-terminal,
        riju-form-satchel,
        cecil-stamp-arm,
        vale-silver-tablet,
        server-closet-table-fan
      ]
    foreground: 'Postal, electoral, clinic, market, railway, and school bundles form
      separate blank-tabbed lanes.'
    middleGround: 'Riju matches sources while Cecil stamps only pairs with visible
      provenance.'
    background: 'The old cupboard doors frame the terminal; the small fan oscillates
      slightly left over its archive box.'
    action: 'Vale adds staff as Riju and Cecil begin the overnight reconciliation
      drive without discarding source trails.'
    dialogue:
      - id: p22-01-d01
        speaker: director-vale
        text: 'More hands. Keep every source.'
        style: speech
        readingOrder: 1
        balloon:
          {
            x: 0.22,
            y: 0.03,
            width: 0.25,
            height: 0.14,
            z: 10,
            tailTarget: { x: 0.20, y: 0.47 },
            tailDirection: down,
            fontScale: 0.88
          }
      - id: p22-01-d02
        speaker: riju-dhar
        text: 'I''ll keep every source attached.'
        style: speech
        readingOrder: 2
        balloon:
          {
            x: 0.598,
            y: 0.012,
            width: 0.10,
            height: 0.18,
            z: 10,
            tailTarget: { x: 0.51, y: 0.49 },
            tailDirection: down,
            fontScale: 0.6
          }
    continuity:
      [
        "The terminal's replaced blue key is third from the right on its top
          function row.",
        'All tabs, screens, inventory marks, and stamp impressions remain
          blank in generated art.'
      ]
    prompt:
      {
        lighting: 'Warm archive lamps against cool terminal light.',
        palette: 'Paper cream, municipal red, moss green, Grid blue, cream enamel and
          graphite.',
        composition: 'Source bundles form strong horizontal lanes towards Riju and
          Cecil; Vale anchors the left; preserve both upper corners.',
        balloonSafeAreas:
          [
            'upper-left reserve: x 0.03-0.36, y 0.03-0.21',
            'upper-centre reserve: x 0.36-0.75, y 0.03-0.21'
          ],
        negative:
          [
            embedded dialogue or lettering,
            speech balloons,
            watermarks,
            signatures,
            copyrighted logos,
            extra limbs,
            pseudo-Bengali glyphs
          ]
      }
    accessibility:
      {
        alt: 'Riju, Cecil, and Vale begin an overnight reconciliation drive in the
          archive room.',
        description: 'Separate bundles from civic systems run across the archive tables.
          Riju works at his refurbished terminal, Cecil stamps verified matches,
          and Vale supplies staff while insisting that every source remain
          traceable.'
      }
    art:
      {
        status: final,
