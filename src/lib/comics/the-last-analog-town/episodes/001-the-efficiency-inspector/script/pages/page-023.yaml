page: 23
title: 'Unknown is not a number the target accepts'
purpose: "Make Riju's consequential mistake explicit and technically legible."
location: golmohar-municipal-hall
time: pre-dawn
layout: 'Six tightening panels move from anomaly categories to one irreversible
  confirmation.'
panelCount: 6
dialogueGoal: 'Let Cecil state the categorical consequence while Riju
  rationalises temporary denial as the price of wider benefit.'
pageTurn: "The system accepts Riju's configuration as valid."
visualMotif: 'A red unresolved column is progressively hidden behind a clean
  green completion bar.'
continuity:
  - 'The unresolved cases include landmark addresses, seasonal absences, variant
    names, failed biometrics, and contradictory ownership.'
  - "Riju's approval credential, Cecil's warning, and the private anomaly ledger
    remain in the intact audit trail."
  - 'The locked configuration is explicit: downstream systems will treat unknown
    as false.'
panels:
  - id: p23-01
    panel: 1
    size: wide
    aspectRatio: '16:9'
    camera: 'Overhead wide shot of the terminal, anomaly file, and five source piles'
    location: golmohar-municipal-hall
    time: pre-dawn
    characters:
      - {
          id: riju-dhar,
          position: left,
          emotion: exhausted analysis,
          pose: 'Sorting anomaly cards into five unresolved groups',
          facing: right
        }
      - {
          id: cecil-c17,
          position: right,
          emotion: categorical enumeration,
          pose: 'Indicating each group with the stamp arm retracted',
          facing: left
        }
    props:
      [
        riju-reconciliation-terminal,
        riju-form-satchel,
        cecil-stamp-arm,
        server-closet-table-fan
      ]
    foreground: 'Five blank-tabbed groups show address, movement, name, biometric,
      and ownership conflicts through distinct objects and diagrams.'
    middleGround: 'The red-marked working file lies open between Riju and Cecil.'
    background: 'A clean empty completion field waits on the terminal.'
    action: 'Riju and Cecil isolate the remaining cases and confirm that none can
      honestly be resolved before launch.'
    dialogue:
      - id: p23-01-d01
        speaker: riju-dhar
        text: 'These aren''t duplicates. They''re questions we can''t answer.'
        style: speech
        readingOrder: 1
        balloon:
          {
            x: 0.52,
            y: 0.012,
            width: 0.10,
            height: 0.14,
            z: 10,
            tailTarget: { x: 0.28, y: 0.48 },
            tailDirection: left,
            fontScale: 0.6
          }
      - id: p23-01-d02
        speaker: cecil-c17
        text: 'Then their valid state is unknown.'
        style: robot
        readingOrder: 2
        balloon:
          {
            x: 0.52,
            y: 0.17,
            width: 0.10,
            height: 0.14,
            z: 10,
            tailTarget: { x: 0.76, y: 0.50 },
            tailDirection: right,
            fontScale: 0.6
          }
    continuity:
      [
        'The anomaly file remains red-marked but has no generated words.',
        "Cecil's status light stays blue and its lower-left dent remains
          visible."
      ]
    prompt:
      {
        lighting: 'Cool terminal light with a narrow pre-dawn window strip.',
        palette: 'Warning red, paper cream, moss green, cream enamel and Grid blue.',
        composition: 'Five materially distinct anomaly groups radiate around the open
          file; Riju and Cecil oppose across it; preserve upper corners.',
        balloonSafeAreas:
          [
            'upper-left reserve: x 0.03-0.55, y 0.03-0.22',
            'upper-right reserve: x 0.54-0.97, y 0.03-0.22'
