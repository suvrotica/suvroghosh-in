page: 24
title: 'Language postponed'
purpose: 'Show a second deadline compromise and preserve local-language access
  as a climax requirement.'
location: golmohar-municipal-hall
time: dawn
layout: 'A wide public test, two close failures, a supervised fallback, and a
  clock-and-list closer.'
panelCount: 5
dialogueGoal: 'Treat meaningful consent and legal language seriously while
  exposing the absurd help route through procedure.'
pageTurn: 'The launch clock reaches one hour while the limitation list keeps
  lengthening.'
visualMotif: 'Blank language fields stay wider than the increasingly narrow path to launch.'
continuity:
  - 'The public-service forms are tested with Bengali-speaking residents under
    human supervision.'
  - 'All Bengali remains Unicode composition work with needs-human-review
    status; no generated pseudo-script appears.'
  - "Local-language explanation is postponed to phase two and entered on Vale's
    review list."
panels:
  - id: p24-01
    panel: 1
    size: wide
    aspectRatio: '16:9'
    camera: 'Eye-level wide shot across the public service annex testing desks'
    location: golmohar-municipal-hall
    time: dawn
    characters:
      - {
          id: riju-dhar,
          position: centre-left,
          emotion: attentive concern,
          pose: 'Watching a resident compare two blank form versions',
          facing: right
        }
      - {
          id: ila-dastidar,
          position: left,
          emotion: guarded scrutiny,
          pose: 'Holding the red ledger beneath her spectacles',
          facing: right
        }
      - {
          id: director-vale,
          position: right,
          emotion: formal observation,
          pose: 'Recording test failures on the silver tablet',
          facing: left
        }
      - {
          id: cecil-c17,
          position: far-right,
          emotion: input comparison,
          pose: 'Scanning aligned blank language fields',
          facing: left
        }
    props:
      [
        riju-reconciliation-terminal,
        municipal-red-ledger,
        vale-silver-tablet,
        cecil-stamp-arm
      ]
    foreground: 'Two otherwise matching forms reserve deterministic fields for
      interface-consent-scope-mismatch, with no generated marks.'
    middleGround: 'Residents point to different consent choices while Riju follows
      their comparison.'
    background: 'A single staffed help desk already has a practical queue.'
    action: 'Testing reveals that the incomplete translation does not let residents
      review the same legal choice.'
    dialogue:
      - id: p24-01-d01
        speaker: ila-dastidar
        text: 'They are not choosing the same thing.'
        style: speech
        readingOrder: 1
        balloon:
          {
            x: 0.012,
            y: 0.02,
            width: 0.19,
            height: 0.13,
            z: 10,
            tailTarget: { x: 0.15, y: 0.39 },
            tailDirection: down,
            fontScale: 0.90
          }
      - id: p24-01-d02
        speaker: riju-dhar
        text: 'The Bengali help text isn''t finished.'
        style: speech
        readingOrder: 2
        balloon:
          {
            x: 0.36,
            y: 0.02,
            width: 0.28,
            height: 0.15,
            z: 10,
            tailTarget: { x: 0.43, y: 0.56 },
            tailDirection: down,
            fontScale: 0.94
          }
