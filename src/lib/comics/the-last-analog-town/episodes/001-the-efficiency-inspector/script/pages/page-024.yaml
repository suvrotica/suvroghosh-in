      [
        'Exact overlay key: interface-consent-scope-mismatch.',
        'Ila uses spectacles for close reading and keeps the ledger under her
          left arm.',
        'Both form substrates and every interface field remain blank in
          generated art.'
      ]
    prompt:
      {
        lighting: 'Soft dawn through annex glass with practical desk lamps.',
        palette: 'Paper cream, municipal red, moss green, graphite and restrained Grid
          blue.',
        composition: 'Paired blank forms dominate foreground; residents and principals
          form a left-to-right test line; preserve upper-left and lower-centre.',
        balloonSafeAreas:
          [
            'upper-left reserve: x 0.03-0.45, y 0.03-0.21',
            'lower-centre reserve: x 0.33-0.81, y 0.72-0.93'
