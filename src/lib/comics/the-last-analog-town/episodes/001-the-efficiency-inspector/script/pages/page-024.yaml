        negative:
          [
            embedded dialogue or lettering,
            speech balloons,
            watermarks,
            signatures,
            copyrighted logos,
            extra limbs,
            pseudo-Bengali glyphs
          ]
      }
    accessibility:
      {
        alt: 'Residents test English and Bengali consent fields that grant different
          authority.',
        description: 'The deterministic English overlay will say that data may be used
          for this request only, while the working Bengali overlay grants use
          across all connected services. Both remain blank in generated art and
          blocked for named human review. Ila recognises that the choices are
          not equivalent.'
      }
    art:
      {
        status: final,
        revision: 1,
