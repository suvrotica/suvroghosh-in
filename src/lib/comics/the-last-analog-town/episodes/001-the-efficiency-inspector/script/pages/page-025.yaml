        "Ila's ledger shows its repaired cover and blank cream title panel.",
        'The trial sheet and ledger entries remain unlettered in generated
          art.'
      ]
    prompt:
      {
        lighting: 'Warm early-morning conference-room light.',
        palette: 'Municipal red, ink blue, paper cream, moss green and aged plaster.',
        composition: "Ila's signature, duration field, review box, and open ledger form
          one accountable cluster; Riju waits at right; reserve upper-left.",
        balloonSafeAreas: [ 'upper-left reserve: x 0.04-0.80, y 0.03-0.23' ],
