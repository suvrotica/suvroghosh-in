page: 25
title: 'Valid for launch'
purpose: 'Close the inspection movement with informed but compromised authorization.'
location: golmohar-municipal-hall
time: early morning
layout: 'Three signing beats, a close human confirmation, and a wide
  synchronisation turn.'
panelCount: 5
dialogueGoal: 'Give Ila, Vale, Riju, and Cecil distinct reasons to proceed while
  keeping human choice visible.'
pageTurn: 'Across Golmohar, disconnected endpoints complete preflight handshakes
  but remain dark for the public launch.'
visualMotif: 'Three physical signatures converge on one clean activation line.'
continuity:
  - 'Ila authorises only a seventy-two-hour public trial with review; Vale
    authorises an audited deployment.'
  - "Riju signs the configuration that treats unresolved values as false, with
    Cecil's warning preserved."
  - 'The trial limits, public review, configuration audit, and language
    limitation remain binding records.'
panels:
  - id: p25-01
    panel: 1
    size: medium
    aspectRatio: '4:3'
    camera: 'Close medium shot on Ila signing beside the open red ledger'
    location: golmohar-municipal-hall
    time: early morning
    characters:
      - {
          id: ila-dastidar,
          position: centre,
          emotion: guarded resolve,
          pose: 'Signing a blank trial sheet while pinning the ledger open with her left
            forearm',
          facing: right
        }
      - {
          id: riju-dhar,
          position: right,
          emotion: anxious attention,
          pose: 'Holding the next document ready',
          facing: left
        }
    props: [ municipal-red-ledger, ila-cracked-phone, riju-form-satchel ]
    foreground: 'The trial sheet has a broad blank duration field and a separate
      review box.'
    middleGround: 'Ila signs only after marking both limits in the ledger.'
    background: 'The off-level conference wall remains subtly visible.'
    action: 'Ila authorises a seventy-two-hour public trial rather than permanent
      adoption.'
    dialogue:
      - id: p25-01-d01
        speaker: ila-dastidar
        text: 'Seventy-two hours. Public review. No quiet extension.'
        style: speech
        readingOrder: 1
        balloon:
