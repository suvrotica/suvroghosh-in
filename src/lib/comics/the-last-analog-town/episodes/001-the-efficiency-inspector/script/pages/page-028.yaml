page: 28
title: 'A time people can use'
purpose: 'Show the train-information improvement changing ordinary behaviour.'
location: golmohar-halt
time: midday
layout: 'A wide range reveal, two ordinary-life beats, a dog-and-train beat, and
  a welfare handoff.'
panelCount: 5
dialogueGoal: 'Seed the rule that honestly communicated uncertainty can be more
  useful than precise fiction.'
pageTurn: 'A commuter uses the newly reconciled identity to open a welfare case.'
visualMotif: 'A useful time range opens space for people to act instead of
  pinning them to one false minute.'
continuity:
  - 'Golmohar Halt retains one working line, unfinished second platform, east
    office, west tea stall, and disagreeing clock pair.'
  - 'The updated prediction is a range, not a false exact time; every display
    and announcement is deterministic lettering.'
  - 'Ghori responds to rail vibration and routine, never to written time.'
