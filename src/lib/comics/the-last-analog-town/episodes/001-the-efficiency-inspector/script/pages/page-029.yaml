page: 29
title: 'Access without an introduction'
purpose: 'Prove that formal integration can help people excluded by informal networks.'
location: golmohar-municipal-hall
time: afternoon
layout: 'A wide annex return, two consent-and-access beats, a silent relief
  beat, and two political consequences.'
panelCount: 6
dialogueGoal: 'Let the claimant value direct access and Ila acknowledge that
  familiar discretion had excluded them.'
pageTurn: 'A clinic result notification reaches a patient before the paper copy.'
visualMotif: 'Two source cards become one doorway while three self-appointed
  helpers remain outside it.'
continuity:
  - 'The welfare claimant reviews and consents to the duplicate-record merge
    first surfaced, but not begun, at Golmohar Halt.'
  - 'Direct formal access succeeds without a personal intermediary, exposing an
    inequity in the old arrangement.'
  - "Riju's completion score rises and reinforces the choice he made before
    launch."
