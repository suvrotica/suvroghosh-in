page: 30
title: 'Results before rumours'
purpose: 'Deepen public trust through another serious, non-comic benefit.'
location: rook-clinic
time: afternoon
layout: 'A result arrival, a clinical decision close-up, a quiet explanation, a
  late-paper beat, and a preservation request.'
panelCount: 5
dialogueGoal: 'Give emotional weight to speed and make preservation of the
  useful result channel an explicit obligation.'
pageTurn: 'The Crosswalk connects the clinic procurement trail to the New
  Development accounts.'
visualMotif: 'A fast cyan result path overtakes one slow paper envelope without
  making paper itself the villain.'
continuity:
  - "This patient's timely result and altered treatment remain distinct from the
    urgent scheduler case on page 36."
  - 'Ananya names the linked result channel as infrastructure that must survive
    later review.'
  - 'All clinical result, label, notification, and envelope text remains
    deterministic composition.'
