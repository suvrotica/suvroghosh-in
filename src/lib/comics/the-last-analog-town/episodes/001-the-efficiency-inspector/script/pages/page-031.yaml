page: 31
title: 'The drains that were paid for'
purpose: 'Make the system expose genuine local corruption and force Ila to choose scrutiny over loyalty.'
location: new-development
time: late afternoon
layout: 'A prestige-wide contradiction, two verification beats, a pressure two-shot, an order close-up, and a political turn.'
panelCount: 6
dialogueGoal: 'Let Vale be right that audit protects residents and Ila prove autonomy cannot mean shielding allies.'
pageTurn: 'News of the frozen payment turns the Mission from a ceremony into a political success.'
visualMotif: 'Perfect rectangular payment records sit over pump-shaped absences in mud.'
continuity:
  - 'The New Development retains absent pumps, nonfunctioning drains, blocked water paths, active surveillance, and contractor completion certificates.'
  - 'Vale verifies the physical site before concluding that the accounting match is corrupt.'
  - "Ila freezes the next payment and orders inspection despite the contractor's local political ties."
