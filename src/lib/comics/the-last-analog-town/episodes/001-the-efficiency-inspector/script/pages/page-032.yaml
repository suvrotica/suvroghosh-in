page: 32
title: 'Ninety-eight point zero'
purpose: 'Reach the apparent-success high point and place Riju one validation
  away from permanence.'
location: junction-square
time: evening
layout: "A celebration-wide opener, two Hall validation beats, Ila's question,
  and a billboard-delivery reversal."
panelCount: 5
dialogueGoal: 'Let Riju enjoy genuine achievement while Ila asks what the
  missing two per cent contains.'
pageTurn: "Babul-da's next medicine delivery is rejected because its address is
  now officially false."
visualMotif: 'A nearly complete circle frames a thin red gap that keeps
  reappearing at the edge.'
continuity:
  - 'Public trust rests on real gains: faster results, clearer train
    information, welfare access, medicine tracing, and exposed spending.'
  - 'The provisional funding notice and promised direct appointment remain
    conditional on overnight anomaly validation.'
  - 'A second billboard support corrects its lean while blocking the remaining
    half of the usable lane.'
