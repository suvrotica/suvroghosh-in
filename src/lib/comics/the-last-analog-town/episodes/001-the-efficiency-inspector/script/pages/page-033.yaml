page: 33
title: 'The address that failed validation'
purpose: "Begin the failure cascade with a small case directly linked to Riju's
  default."
location: junction-square
time: next morning
layout: 'A route rejection, a map contradiction, a successful human delivery,
  two clinic-system consequences, and a fraud-alert turn.'
panelCount: 6
dialogueGoal: 'Let Babul distinguish finding a person from proving the system
  can find them while Riju promises a routine patch.'
pageTurn: "Riju's address correction opens a welfare fraud alert on the same household."
visualMotif: 'A physical route reaches the resident while a red digital route
  repeatedly stops short.'
continuity:
  - 'Babul retains the medicine parcel rejected on page 32 and knows the
    old-cinema landmark route.'
  - "The address phrase 'behind the old cinema' cannot resolve to a standard
    parcel and becomes officially false."
  - "The medicine-tracking benefit now records Babul's successful handoff as
    unauthorised and suppresses future dispatch."
