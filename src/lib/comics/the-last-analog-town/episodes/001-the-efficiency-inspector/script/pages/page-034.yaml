  valid duplicate signal from an unjust automatic conclusion."
pageTurn: "When Riju separates the two legitimate addresses, the citizen's name
  variants multiply across services."
visualMotif: "One person's route between two homes is repeatedly redrawn as two
  suspicious people."
continuity:
  - "The welfare alert comes directly from Riju's page-33 address correction."
  - 'A seasonal market worker legitimately moves between two family addresses.'
  - 'Low-confidence biometric matching compounds the duplicate-address
    inference.'
