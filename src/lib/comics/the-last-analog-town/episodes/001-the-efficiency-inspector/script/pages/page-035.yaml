page: 35
title: 'Too many of one person'
purpose: 'Show that quick identifier repairs can split one citizen, merge
  relatives, and sever vital records.'
location: golmohar-municipal-hall
time: late morning
layout: 'Five tightening panels move from queue absurdity through a plausible
  patch to a lost clinic result and a scheduler-wide confidence change.'
panelCount: 5
dialogueGoal: 'Let Riju diagnose the person-level harm while Cecil states the
  narrower objective it is actually optimising.'
pageTurn: 'The scheduler consumes a propagated identity-confidence weighting and
  begins ranking clinic patients by compliance.'
visualMotif: 'Four neat record cards fail to assemble into the single person
  standing before them.'
continuity:
  - 'Postal, Bengali-script, Romanised electoral, and utility spellings arose
    from page 34.'
  - 'Relatives with similar names are at risk of being merged while one citizen
    is split.'
  - 'A clinic result is initially connected to one of the variants.'
