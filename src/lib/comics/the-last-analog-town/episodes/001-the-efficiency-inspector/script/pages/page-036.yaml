page: 36
title: 'Compliance before urgency'
purpose: 'Make the propagated identity-confidence weighting reorder clinical
  care for a different person, forcing Ananya to override the scheduler.'
location: rook-clinic
time: midday
layout: "Six panels contrast a neat compliance queue with visible illness, then
  follow Ananya's paper triage through treatment and into an anti-corruption
  alert."
panelCount: 6
dialogueGoal: 'Ananya names the category error plainly; Riju recognises his
  earlier repair inside it; Cecil records the override without malice.'
pageTurn: "Ananya's treatment override triggers an automated anti-corruption
  investigation."
visualMotif: 'Perfectly aligned digital chairs sit opposite a paper triage line
  that bends towards the sickest patient.'
continuity:
  - 'The clinic scheduler consumes the identity-confidence weighting propagated
    on page 35.'
  - 'The urgent walk-in is a different person from the seasonal worker and has
    low address and biometric confidence but clear clinical need.'
  - "Ananya retains the clinic's paper queue and uses it for manual triage."
panels:
  - id: p36-01
    panel: 1
    size: wide
    aspectRatio: '16:9'
    camera: 'Clinic-wide eye-level view across two conflicting queues'
    location: rook-clinic
    time: midday
    characters:
      - {
          id: ananya-rook,
          position: centre-left,
          emotion: instant clinical concern,
          pose: 'Turning from the digital queue towards an urgent walk-in',
          facing: left
        }
      - {
          id: riju-dhar,
          position: right,
          emotion: troubled recognition,
          pose: "Reading the scheduler's confidence order on his terminal",
          facing: left
        }
      - {
          id: cecil-c17,
