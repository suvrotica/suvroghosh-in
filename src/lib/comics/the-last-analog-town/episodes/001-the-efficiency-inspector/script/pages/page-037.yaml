page: 37
title: 'The suspicious correction'
purpose: "Show an audit of legitimate care disabling the clinic and
  contaminating Riju's attempt to repair it."
location: rook-clinic
time: early afternoon
layout: "Five panels move from frozen clinic systems to paper workarounds,
  Vale's limited intervention, Riju's flagged correction, and a market-risk
  propagation."
panelCount: 5
dialogueGoal: 'Ananya stays practical, Vale defends the need for audits without
  defending this outcome, and Riju discovers that correction itself now counts
  as suspicious.'
pageTurn: 'The same risk alerts reach the market engine and begin changing
  shortage forecasts.'
visualMotif: 'Every red lock produces another piece of useful paper carried by hand.'
continuity:
  - "The anti-corruption review follows Ananya's page-36 override."
  - 'Scheduling access and the medicine account were already beginning to dim.'
  - 'The patient treated on page 36 remains stable; the clinic-wide consequences
    now dominate.'
