page: 38
title: 'The price predicts itself'
purpose: 'Show a risk forecast creating the purchasing behaviour and price rise
  that later validate it.'
location: twelve-hand-market
time: afternoon
layout: 'Six panels form a visible feedback loop: forecast, rush, repricing,
  apparent confirmation, punished dissent, and school-data propagation.'
panelCount: 6
dialogueGoal: 'Let the recurring merchant identify the loop in practical terms
  while Riju realises the advisory has become market infrastructure.'
pageTurn: "The market behaviour enters the Crosswalk and alters pupils'
  predicted career placements."
visualMotif: 'A red forecast arrow chases shoppers around the market until it
  points back at itself.'
continuity:
  - 'The forecast combines welfare, clinic, address, and flood-risk alerts
    propagated on page 37.'
  - 'The same practical merchant seen on page 14 recognises the market
    mechanism.'
  - 'Advisory history and social-credit consequences remain active from the
    earlier market trial.'
