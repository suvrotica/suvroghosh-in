page: 39
title: 'Careers before laboratories'
purpose: 'Show predictive school placement turning unstable living conditions
  into permanent limits on pupils.'
location: golmohar-school-3
time: afternoon
layout: "Five panels contrast confident career sorting with a broken laboratory,
  grant pressure, Vale's qualified defence, and an absurdly successful goat
  profile."
panelCount: 5
dialogueGoal: "Teachers reject permanent sorting, Vale allows a contestable
  advisory role, and Riju keeps the pupils' actual opportunities in view."
pageTurn: 'The school transport optimiser reroutes pupils through a lane that
  disappears during the monsoon.'
visualMotif: 'Bright projected futures hover above empty shelves and one shared
  laboratory kit.'
continuity:
  - 'School predictions consume attendance, flood displacement, market
    behaviour, and household risk from earlier pages.'
  - 'Teachers maintain parallel paper registers alongside the attendance
    scanner.'
  - 'The laboratory still has one shared kit and materially constrained access.'
panels:
