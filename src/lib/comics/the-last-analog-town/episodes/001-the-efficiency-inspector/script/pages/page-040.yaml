page: 40
title: 'The road that goes away'
purpose: 'Put local monsoon knowledge against a traffic model that recognises
  only permanent mapped roads and current rain.'
location: new-development
time: late afternoon
layout: "Six panels follow the rerouted traffic into the lane, establish the
  physical contradictions, test Babul's warning, and end on a dry-weather
  upstream alert."
panelCount: 6
dialogueGoal: 'Babul explains the disappearing lane concretely; Vale asks for
  evidence the emergency system can verify; Riju exposes the map assumptions
  between them.'
pageTurn: 'The Old Exchange receives an upstream water-release warning while
  every local rain sensor remains clear.'
visualMotif: 'A clean smart-route arrow runs straight across old flood marks,
  broken drains, and a lane that narrows towards the canal.'
continuity:
  - 'The school transport update on page 39 feeds directly into the traffic
    optimiser.'
  - 'The New Development retains the road-over-pond map, blocked drains, absent
    pumps, and backup-powered surveillance.'
  - 'The weather remains visibly dry throughout the page.'
