page: 41
title: 'No rain, no flood'
purpose: 'Show procedure rejecting a credible upstream warning because the local
  measurement and incident-number prerequisites are absent.'
location: old-exchange
time: early evening
layout: "Six panels move from a timestamped manual warning through automated
  rejection to Babul's road warning, observed water, and Riju's emergency batch
  correction."
panelCount: 6
dialogueGoal: "Keep the caller's warning specific, let Cecil distinguish
  measured local rain from accepted incident status, and make Riju respond by
  trying to correct every linked emergency case."
pageTurn: 'Riju attempts a batch of emergency corrections across the flood,
  clinic, and welfare cases.'
visualMotif: 'A dry umbrella icon stays rigid while real canal water quietly
  rises from the bottom edge.'
continuity:
  - 'The sky remains rainless; the arriving water comes from an upstream
    release.'
  - 'The warning is credible, manually received, and timestamped in the Old
    Exchange circuit record.'
  - 'The low lane remains routed for school, clinic, bus, and delivery traffic.'
