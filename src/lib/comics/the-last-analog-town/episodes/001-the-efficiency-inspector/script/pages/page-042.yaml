            height: 0.19,
            z: 10,
            tailTarget: { x: 0.24, y: 0.50 },
            tailDirection: down,
            fontScale: 0.88,
            manualBreaks:
              [
                'The warning was right.',
                'Close the lane, put the clinic''s reason back',
                'and reopen the appeal.'
              ]
          }
    continuity:
      [
        'The terminal retains its one replaced blue key.',
        'All interface lettering remains blank for deterministic composition.'
      ]
    prompt:
