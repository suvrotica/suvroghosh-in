page: 42
title: 'Corrections quarantined'
purpose: "End the connected-error movement by removing the town's ability to
  patch failures informally."
location: golmohar-municipal-hall
time: evening
layout: 'Two tight technical panels, a wide institutional reversal, a square
  procedural joke, and a silent wide danger turn.'
panelCount: 5
dialogueGoal: 'Let Cecil explain that the system is protecting itself from the
  exact intervention pattern it was designed to detect.'
pageTurn: 'Rainless canal water crosses the smart route line at the New Development.'
visualMotif: 'Human corrections stacking behind one clean quarantine barrier.'
continuity:
  - "The upstream warning, flooded-lane risk, Ananya's medical override and
    seasonal-migration welfare appeal are all still active."
  - "Riju's credentials and every pending manual override are quarantined; there
    is no reset."
  - "Vale's emergency request enters the same review queue."
panels:
  - id: p42-01
    panel: 1
    size: medium
    aspectRatio: '4:3'
    camera: 'Over-Riju view into the cramped server cupboard'
    location: golmohar-municipal-hall
    time: evening
    characters:
      - {
          id: riju-dhar,
          position: foreground-left,
          emotion: urgent concentration,
          pose: 'Working the replaced blue key while four blank case panes stack on the
            terminal',
          facing: right
        }
      - {
          id: cecil-c17,
          position: right,
          emotion: exact monitoring,
          pose: 'Holding its stamp arm above the pending panes',
          facing: left
        }
    props:
      [
        riju-reconciliation-terminal,
        riju-form-satchel,
        cecil-stamp-arm,
        server-closet-table-fan
      ]
    foreground: "Riju's brown satchel lies open beside the terminal, its forms
      divided into four source bundles."
    middleGround: 'Four blank interface panes represent the flood warning, lane
      closure, clinical override and welfare appeal.'
    background: 'The small table fan pushes hot air through an overfilled cable cupboard.'
    action: 'Riju submits four emergency corrections in quick succession without
      hiding their different sources.'
    dialogue:
