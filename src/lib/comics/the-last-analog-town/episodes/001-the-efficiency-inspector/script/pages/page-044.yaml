            height: 0.17,
            z: 10,
            tailTarget: { x: 0.51, y: 0.50 },
            tailDirection: down,
            fontScale: 0.90,
            manualBreaks: [ 'The forecast raised prices. The prices raised the forecast.' ]
          }
      - id: p44-01-d02
        speaker: babul-courier
        text: 'And the cars raised everything else.'
        style: speech
        readingOrder: 2
        balloon:
          {
            x: 0.03,
            y: 0.76,
            width: 0.39,
            height: 0.14,
            z: 10,
            tailTarget: { x: 0.17, y: 0.60 },
            tailDirection: up,
            fontScale: 0.94,
            manualBreaks: [ 'And the cars raised everything else.' ]
          }
    continuity:
      [
        'Residents carry plausible household purchases, not panic hoards.',
        'All price, alert and payment lettering remains blank.'
      ]
    prompt:
      {
        lighting: 'Market bulbs and vehicle lamps under deepening blue dusk.',
        palette: 'Awning red, mustard, wet grey, ochre, moss, cream enamel and warning
