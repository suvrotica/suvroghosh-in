page: 44
title: 'Demand forecast: panic'
purpose: 'Make separate linked failures collide in public space without treating
  residents as irrational.'
location: twelve-hand-market
time: dusk
layout: 'Wide congestion opener, two market mechanism panels, a tall ambulance
  corridor, and a tight clinic-gate turn.'
panelCount: 5
dialogueGoal: 'Show understandable buying and local coordination becoming
  reinforcement inside the forecast.'
pageTurn: "The ambulance's destination address fails validation at Rook Clinic."
visualMotif: 'A tightening loop of vehicles, buyers, stock and predicted demand.'
continuity:
  - 'Diverted New Development traffic enters Twelve-Hand Market.'
  - 'The ambulance carries the rescued bus passenger whose breathing worsened on
    the raised service walk.'
  - 'Forecast-driven prices and shortage alerts remain connected after merchants
    blank the recommendation display.'
  - 'The ambulance heads towards Rook Clinic through a resident-made corridor.'
panels:
  - id: p44-01
    panel: 1
    size: wide
    aspectRatio: '16:9'
    camera: 'High wide view across the market crossing'
    location: twelve-hand-market
    time: dusk
    characters:
      - {
          id: babul-courier,
          position: foreground-left,
          emotion: active concern,
          pose: 'Pushing the cycle van into a gap to organise the diverted traffic',
          facing: right
        }
      - {
          id: riju-dhar,
          position: centre,
          emotion: horrified calculation,
          pose: 'Comparing the blank market pane with the real queue',
          facing: left
        }
      - {
          id: cecil-c17,
          position: right,
          emotion: multi-system monitoring,
          pose: 'Shutters alternating between vehicle and stall flows',
          facing: left
        }
    props:
      [
        babul-cycle-van,
        riju-reconciliation-terminal,
        market-price-slates,
        competing-payment-placards,
        cecil-stamp-arm
      ]
    foreground: 'Diverted vehicles meet shoppers carrying ordinary household quantities.'
    middleGround: 'Shortage alerts draw more residents to stalls while prices rise
      on blank deterministic overlays.'
    background: 'The ambulance carrying the rescued bus passenger is visible at the
      far end of the crossing.'
    action: 'Reasonable buying, diverted traffic and price warnings compress into
      one market jam.'
    dialogue:
      - id: p44-01-d01
        speaker: riju-dhar
        text: 'The forecast raised prices. The prices raised the forecast.'
        style: speech
        readingOrder: 1
        balloon:
