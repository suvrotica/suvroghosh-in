page: 45
title: 'Treatment without permission'
purpose: 'Bring the cascade to its sharpest human medical consequence.'
location: rook-clinic
time: night
layout: 'Wide arrival, two tight denial beats, a half-page clinical decision, a
  silent treatment panel, and a reason-log turn.'
panelCount: 6
dialogueGoal: 'Let Ananya act first and show that swift human judgement can
  still be documented and audited.'
pageTurn: "Vale attempts to authorise Ananya's decision from Mission level."
visualMotif: 'A sealed paper reserve opening while blank digital permissions remain closed.'
continuity:
  - 'The urgent patient comes from the flooded lane.'
  - 'Patient identity and clinic location both have conflicting records.'
  - "The sealed paper reserve and Ananya's handwritten reason log must reach the
    public hearing."
