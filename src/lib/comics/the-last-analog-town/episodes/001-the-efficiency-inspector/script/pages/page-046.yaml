page: 46
title: 'Authority not found'
purpose: 'Demonstrate that even Vale is constrained by incompatible classification.'
location: rook-clinic
time: night
layout: 'Alternating clinic and Hall panels, a three-category wide, a quiet
  competence beat, a stamp joke, and a dependency turn.'
panelCount: 6
dialogueGoal: "Preserve Vale's competence while showing that formal authority
  also depends on a category the records cannot settle."
pageTurn: "Cecil identifies Riju's launch default as the common dependency
  beneath every denial."
visualMotif: 'Three valid seals cancelling one another over one urgent physical fact.'
continuity:
  - 'Golmohar remains classified as a railway entity, weather station and
    transitional area.'
  - "Ananya's patient is stable through a documented manual override."
  - 'Vale submits a genuine emergency authorisation and receives a jurisdiction
    rejection.'
