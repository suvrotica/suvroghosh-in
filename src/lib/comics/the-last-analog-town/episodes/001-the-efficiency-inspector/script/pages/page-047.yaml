    size: wide
    aspectRatio: '16:9'
    camera: 'Over-Riju wide view of the complete dependency trace'
    location: golmohar-municipal-hall
    time: night
    characters:
      - {
          id: riju-dhar,
          position: left,
          emotion: stunned concentration,
          pose: 'Bracing both hands on the terminal while the seven branches remain
            separated',
          facing: right
        }
      - {
          id: cecil-c17,
          position: right,
          emotion: formal analysis,
          pose: 'Indicating the shared default with the stamp arm',
          facing: left
