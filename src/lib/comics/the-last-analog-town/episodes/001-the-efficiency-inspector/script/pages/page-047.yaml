page: 47
title: 'The hidden common cause'
purpose: 'Move Riju from patching symptoms to recognising his responsibility.'
location: golmohar-municipal-hall
time: night
layout: 'Wide dependency map, two close admissions, a recorded-warning panel,
  and a rollback turn.'
panelCount: 5
dialogueGoal: 'Deny Riju the comfort of blaming a rogue system while keeping his
  deadline fear credible.'
pageTurn: 'Riju reaches for a total rollback; on the turn, Vale stops him.'
visualMotif: 'Seven green branches returning to one red-edged approved default.'
continuity:
  - 'Only Riju and Cecil are present in the server cupboard.'
  - 'The private anomaly ledger stays concealed for one more sequence.'
  - "Riju's audit log and Cecil's recorded warning remain intact."
panels:
  - id: p47-01
