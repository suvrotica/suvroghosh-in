    props: [ riju-reconciliation-terminal, cecil-stamp-arm, server-closet-table-fan ]
    foreground: 'Seven tidy blank service panes glow green at the edge.'
    middleGround: 'Their paths converge on one red-edged approved default.'
    background: 'The cupboard cables physically echo the converging diagram.'
    action: 'Riju traces all seven failures to the Crosswalk output that changed
      unresolved values.'
    dialogue:
      - id: p47-01-d01
        speaker: riju-dhar
        text: 'Address, welfare, clinic, prices, school, traffic, flood—it all came
          from the same output.'
        style: speech
        readingOrder: 1
        balloon:
          {
            x: 0.34,
            y: 0.03,
            width: 0.58,
            height: 0.21,
            z: 10,
            tailTarget: { x: 0.25, y: 0.48 },
            tailDirection: down,
            fontScale: 0.82,
            manualBreaks:
              [
                'Address, welfare, clinic,',
                'prices, school, traffic,',
                'flood—it all came from',
                'the same output.'
              ]
          }
      - id: p47-01-d02
        speaker: cecil-c17
        text: 'Unknown values were exported as false.'
        style: robot
        readingOrder: 2
        balloon:
          {
            x: 0.65,
            y: 0.76,
            width: 0.33,
            height: 0.14,
            z: 10,
            tailTarget: { x: 0.80, y: 0.57 },
            tailDirection: up,
            fontScale: 0.94,
            manualBreaks: [ 'Unknown values were exported as false.' ]
