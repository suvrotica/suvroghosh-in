page: 48
title: 'What the audit also found'
purpose: 'Prevent the old order from becoming an easy moral refuge.'
location: golmohar-municipal-hall
time: night
layout: 'Rollback interruption, two evidence panels, a tight recognition, a
  balanced decision, and a flood-message turn.'
panelCount: 6
dialogueGoal: 'Let Vale be right about the gains and the abuse, then force Ila
  and Riju towards a discriminating solution.'
pageTurn: 'Evidence arrives that water is entering the New Development through
  the absent pump site.'
visualMotif: 'Useful service trails and corrupt exception trails sharing the
  same audit table.'
continuity:
  - 'A total rollback would erase medicine traces, clinic results, welfare
    access, train data and the missing-drain evidence.'
  - 'Manual procurement overrides repeatedly benefit one contractor.'
  - 'Ila recognises a familiar signature and chooses to preserve the evidence.'
panels:
