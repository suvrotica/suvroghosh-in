    time: night
    characters:
      - {
          id: director-vale,
          position: right,
          emotion: firm urgency,
          pose: "Placing one gloved hand flat beside, not on, Riju's reaching wrist",
          facing: left
        }
      - {
          id: riju-dhar,
          position: left,
          emotion: startled shame,
          pose: 'Stopping short of the rollback control',
          facing: right
        }
      - {
          id: cecil-c17,
          position: lower-right,
          emotion: audit readiness,
          pose: 'Turning from the rollback to the evidence table',
          facing: left
        }
