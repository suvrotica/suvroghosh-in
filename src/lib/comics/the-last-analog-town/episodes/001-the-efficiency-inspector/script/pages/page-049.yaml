page: 49
title: 'Open the perfect gate'
purpose: 'Make Ila choose public safety and evidence over a politically
  convenient ally.'
location: new-development
time: night
layout: 'Wide trapped-water reveal, a tight political refusal, two
  accountable-action panels, and a communications-failure turn.'
panelCount: 5
dialogueGoal: 'Show swift manual authority becoming reviewable evidence rather
  than an invisible favour.'
pageTurn: 'Opening the gate saves the lane but overloads the modern communications link.'
visualMotif: 'A perfect locked access leaf across the sole low cut becoming a
  measured, recorded breach.'
continuity:
  - 'The decorative double gate has open side gaps on raised embankments, but
    its locked access leaf blocks the sole low diversion channel.'
  - 'The absent pump site continues to admit water.'
  - "Gate damage, Ila's written reason and Cecil's physical record feed the
    hybrid design."
