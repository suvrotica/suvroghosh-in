page: 50
title: 'The old network answers'
purpose: 'Activate the Old Exchange as a fallback while exposing the limits of
  local social knowledge.'
location: old-exchange
time: night
layout: 'Wide switchboard revival, two connection beats, an omission reversal, a
  corroboration panel, and a comic emergency turn.'
panelCount: 6
dialogueGoal: 'Show the manual network saving lives and excluding newcomers on
  the same page.'
pageTurn: 'The exchange receives notice that the utility disconnection crew is
  at Municipal Hall.'
visualMotif: 'Live patch cords crossing a trusted-call list with one conspicuous gap.'
continuity:
  - 'The Old Exchange battery carries essential calls only.'
  - 'The trusted-call list omits a newer settlement.'
  - 'Riju adds the settlement using two corroborating witnesses and keeps the
    correction source.'
panels:
