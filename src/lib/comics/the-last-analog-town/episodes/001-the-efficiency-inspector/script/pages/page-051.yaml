page: 51
title: 'Evidence in motion'
purpose: 'Turn the investigation into a physical race across established
  Golmohar geography.'
location: old-exchange
time: night
layout: 'Two packing beats, a departure wide, a Junction chase sequence, and a
  Hall-arrival turn.'
panelCount: 6
dialogueGoal: 'Let Riju understand that evidence gains meaning through source,
  route and custody, not transmission alone.'
pageTurn: 'The utility crew reaches the server cupboard before Riju reaches the
  building entrance.'
visualMotif: 'Paper sources and a battery-limited robot travelling faster by
  cycle van than the smart network.'
continuity:
  - 'Paper maps, utility ledger, clinic reasons and upstream warning must arrive
    intact.'
  - "Cecil rides on Babul-da's cycle van to conserve battery."
  - 'The opening billboard still blocks one lane at Junction Square.'
