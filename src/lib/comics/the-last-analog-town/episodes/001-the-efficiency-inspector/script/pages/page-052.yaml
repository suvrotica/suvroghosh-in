page: 52
title: 'The building that cannot owe money'
purpose: 'Trigger the peak failure through the same address logic that harmed
  residents.'
location: golmohar-municipal-hall
time: night
layout: 'Wide procedural confrontation, a seven-record insert, two jurisdiction
  deadlocks, and a disconnection turn.'
panelCount: 5
dialogueGoal: 'Keep the utility crew humane and procedural while the circular
  grievance rule returns at civic scale.'
pageTurn: 'The valid disconnection order executes.'
visualMotif: 'Seven valid building identities surrounding one property account
  that cannot attach to any of them.'
continuity:
  - 'Reuse the Hall property identities from page 6, map conflict from page 19
    and circular complaint rule from page 7.'
  - 'The utility order is valid under its approved records.'
  - 'Riju, Vale, Cecil and Ila cannot produce an authorised property category
    before execution.'
