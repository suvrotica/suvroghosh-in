            x: 0.70,
            y: 0.03,
            width: 0.28,
            height: 0.18,
            z: 10,
            tailTarget: { x: 0.835, y: 0.495 },
            tailDirection: down,
            fontScale: 0.94,
            manualBreaks: [ 'External power lost. Battery service is limited.' ]
          }
      - id: p53-01-d02
        speaker: riju-dhar
        text: 'We linked the benefits too.'
        style: speech
        readingOrder: 2
        balloon:
          {
            x: 0.18,
            y: 0.505,
            width: 0.175,
            height: 0.125,
            z: 10,
            tailTarget: { x: 0.415, y: 0.175 },
            tailDirection: up,
            fontScale: 0.97
          }
    visualJoke: 'The former records cupboard glows from one robot light while the
      glass digital annex is black.'
    continuity:
      [
        'The fan, servers and annex lose power together.',
        "Cecil's status light stays blue and dim."
      ]
    prompt:
      {
        lighting: "Abrupt darkness with Cecil's blue light, one lantern and dim tablet
