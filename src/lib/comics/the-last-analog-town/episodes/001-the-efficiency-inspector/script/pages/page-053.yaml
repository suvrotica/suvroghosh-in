page: 53
title: 'Everything useful goes dark'
purpose: 'Show that failure of integration destroys benefits as well as
  controls, ruling out sabotage as a solution.'
location: golmohar-municipal-hall
time: night
layout: 'Six linked outage panels moving from Hall to clinic, halt, market,
  school and back to the former records cupboard.'
panelCount: 6
dialogueGoal: 'Let the cast name the gains that must be restored instead of
  celebrating the blackout.'
pageTurn: 'Ila invokes an emergency public review under the live-trial clause.'
visualMotif: 'Useful blue links extinguishing one by one while small local
  fallback lights remain.'
continuity:
  - 'Medicine tracking, clinic results, train information, welfare access,
    market data and school records fail together.'
  - 'Paper clinical care and essential Old Exchange calls continue with limited
    capacity.'
  - 'Cecil remains on battery with a single blue status light.'
panels:
  - id: p53-01
    panel: 1
    size: wide
    aspectRatio: '16:9'
    camera: 'Wide blackout beat across the server cupboard and annex'
    location: golmohar-municipal-hall
    time: night
    characters:
      - {
          id: ila-dastidar,
          position: left,
          emotion: shocked assessment,
          pose: 'Holding the closed red ledger as the annex dies',
          facing: right
        }
      - {
          id: riju-dhar,
          position: centre-left,
          emotion: devastated recognition,
          pose: 'Watching every linked pane vanish from the terminal',
          facing: right
        }
      - {
          id: director-vale,
          position: centre-right,
          emotion: grave attention,
          pose: 'Recording the simultaneous loss on a dim tablet',
          facing: left
        }
      - {
          id: cecil-c17,
          position: right,
          emotion: battery conservation,
          pose: 'Remaining lit by one dim blue status light',
          facing: front
        }
    props:
      [
        municipal-red-ledger,
        riju-reconciliation-terminal,
        vale-silver-tablet,
        cecil-stamp-arm,
        server-closet-table-fan
      ]
    foreground: 'The table fan stops with one blade tilted.'
    middleGround: 'Server and glass annex go completely dark.'
    background: "The old records cupboard catches Cecil's lone blue light."
    action: 'Power loss collapses all connected services at once.'
    dialogue:
      - id: p53-01-d01
        speaker: cecil-c17
        text: 'External power lost. Battery service is limited.'
        style: robot
        readingOrder: 1
        balloon:
