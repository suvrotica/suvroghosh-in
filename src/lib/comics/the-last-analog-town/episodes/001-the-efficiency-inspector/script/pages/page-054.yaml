page: 54
title: 'The anomaly ledger'
purpose: "End the crisis movement with Riju's public confession and a viable
  path into the climax."
location: golmohar-municipal-hall
time: late night
layout: 'Wide hearing assembly, three progressively tighter confession beats,
  and a balanced challenge turn.'
panelCount: 5
dialogueGoal: 'Make Riju accountable without self-pity and let Vale set the test
  for a hybrid solution.'
pageTurn: 'Vale asks Riju to show a system that can state what it does not know.'
visualMotif: 'A private anomaly notebook moving from shadow into the centre of a
  public evidence table.'
continuity:
  - 'The anomaly ledger, clinical reason log, maps, utility order, contractor
    evidence and trial clause are present.'
  - 'Riju admits approving unknown equals false, hiding the anomaly count and
    being influenced by the promised post.'
  - 'No one accepts denial, total rollback or restoration of unlogged favour.'
