page: 55
title: 'The failure hearing'
purpose: "Begin the climax with public evidence, constraints and Riju's
  irreversible personal choice."
location: golmohar-municipal-hall
time: late night
layout: 'Personal-choice opener, three linked case panels, a two-rule
  confrontation, and a bell-led category turn.'
panelCount: 6
dialogueGoal: "Convert blame into testable requirements and make Riju's
  sacrifice an active institutional choice."
pageTurn: 'Cecil proposes the category the system lacked: unknown.'
visualMotif: 'Seven harmed cases entering one hearing as separate, sourced files.'
continuity:
  - 'Address denial, frozen welfare, urgent triage, price loop, school
    prediction, flood warning and utility cut all retain source and time.'
  - 'The promised direct appointment is formally withdrawn.'
  - 'Vale rules out unlogged favour; Ila rules out consequential denial without
    appeal.'
