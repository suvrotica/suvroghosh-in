page: 56
title: 'Three values and a reason'
purpose: 'Define all eleven hybrid-governance conditions through concrete roles
  and enforceable controls.'
location: golmohar-municipal-hall
time: continuous late night
layout: 'Six rule-building panels moving from value logic through appeals, care,
  addresses, work observation and offline continuity.'
panelCount: 6
dialogueGoal: 'Keep Cecil categorical, distribute the rules across the cast and
  let disagreement sharpen enforceability.'
pageTurn: 'Vale permits one battery-powered field trial before the network is restored.'
visualMotif: 'A third ink pad turning a binary rail into a branching, reviewable process.'
continuity:
  - 'Rule 1: algorithms may recommend only while displaying uncertainty and
    known failure conditions.'
  - 'Rule 2: unknown remains distinct from false.'
  - 'Rule 3: consequential decisions require an accessible appeal and human
    recourse.'
  - 'Rule 4: local-language explanations are a launch condition.'
  - 'Rule 5: people can correct identity and address errors.'
  - 'Rule 6: manual overrides carry reasons and audit trails rather than
    automatic punishment.'
  - 'Rule 7: no single score decides healthcare, education, welfare, policing or
    employment.'
  - 'Rule 8: designers observe actual work before digitising it.'
  - 'Rule 9: informal practices are assessed individually rather than preserved
    or erased as a class.'
  - 'Rule 10: public services continue through network and power failure.'
  - 'Rule 11: accuracy claims are published beside known failure conditions.'
