page: 57
title: 'The exceptions become cases'
purpose: 'Prove the rules under pressure using the people and places already harmed.'
location: rook-clinic
time: pre-dawn
layout: 'Five location-linked field tests: clinic, market, school, flooded lane
  and a consolidating evidence beat.'
panelCount: 5
dialogueGoal: 'Show human recourse changing outcomes while preserving sources,
  reasons and review.'
pageTurn: 'The field trial works, but full service still depends on restoring
  electricity to the nonexistent Hall.'
visualMotif: 'Red exception marks becoming separate amber case trails with named reasons.'
continuity:
  - 'Paper and digital records remain parallel; no case is silently erased.'
  - 'The seasonal-migration welfare appeal opens, urgent override validates,
    school prediction suspends, market loop quarantines and flooded lane closes
    on observed water.'
  - 'The Hall remains without server power.'
