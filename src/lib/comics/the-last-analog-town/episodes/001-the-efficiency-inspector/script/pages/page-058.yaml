page: 58
title: 'Provisionally existent'
purpose: 'Resolve the utility contradiction through bounded hybrid procedure
  rather than influence or sabotage.'
location: golmohar-municipal-hall
time: pre-dawn
layout: 'Six-step resolution: source separation, reasoned attestation, physical
  confirmation, provisional category, accessible appeal and timed restoration.'
panelCount: 6
dialogueGoal: 'Show a fast decision that remains attributable, time-limited,
  correctable and open to review.'
pageTurn: 'The server restarts with uncertainty visible instead of hidden.'
visualMotif: 'Seven conflicting property records supporting one temporary bridge
  rather than one false merge.'
continuity:
  - 'The exception records reason, responsible humans, physical evidence, expiry
    and appeal trail.'
  - 'The seven Hall property sources remain distinct.'
  - 'Vale opens human recourse without the impossible post-submission complaint
    number.'
