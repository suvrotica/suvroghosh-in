page: 59
title: 'Better because incomplete'
purpose: 'Deliver the action payoff as linked services return with safeguards
  and visible uncertainty.'
location: golmohar-municipal-hall
time: dawn
layout: 'Six-location dawn montage: Hall, clinic, halt, market, school and New
  Development.'
panelCount: 6
dialogueGoal: 'Show that stronger evidence includes both system limits and
  accountable human intervention.'
pageTurn: 'Vale asks the council to make the emergency rules binding beyond the night.'
visualMotif: 'Green service paths returning beside amber uncertainty and red
  human-reason trails.'
continuity:
  - 'Medicine tracking, clinic results, train ranges and welfare access retain
    their earlier gains.'
  - 'Addresses stay reachable while under correction; urgent care outranks
    compliance; school guidance is contestable; market failure conditions are
    visible; traffic follows observed closure.'
  - "Contractor evidence and Ila's gate-opening reason remain side by side."
