page: 60
title: 'The terms of being improved'
purpose: "Ratify the enforceable hybrid trial and resolve Riju's employment
  stake without favour."
location: golmohar-municipal-hall
time: sunrise
layout: 'Charter reveal, signature-and-stamp joke, funding condition, open-post
  correction and public temporary extension.'
panelCount: 5
dialogueGoal: 'Make the settlement a negotiated institutional change accepted
  because it creates better evidence.'
pageTurn: 'Morning begins in a town that is neither restored nor standardised.'
visualMotif: 'Eleven blank rule strips binding one digital record, one paper
  fallback and one public rules board.'
continuity:
  - 'Binding condition 1: recommendations display uncertainty and known failure
    conditions.'
  - 'Binding condition 2: unknown remains distinct from false.'
  - 'Binding condition 3: consequential decisions provide accessible appeal and
    human recourse.'
  - 'Binding condition 4: local-language explanations are available.'
  - 'Binding condition 5: identity and address errors are correctable.'
  - 'Binding condition 6: manual overrides include reasons, audit trails and
    later review rather than automatic punishment.'
  - 'Binding condition 7: no single score decides healthcare, education,
    welfare, policing or employment.'
  - 'Binding condition 8: designers observe actual work before digitising it.'
  - 'Binding condition 9: informal practices are evaluated individually rather
    than preserved or erased as a class.'
  - 'Binding condition 10: public services continue through network and power
    failure.'
  - 'Binding condition 11: accuracy claims are published beside known failure
    conditions.'
  - 'Mission funds are conditional on the documented trial, not unquestioned
    compliance.'
  - 'Riju receives a paid time-limited transition extension and a fair open
    application, not a permanent appointment.'
