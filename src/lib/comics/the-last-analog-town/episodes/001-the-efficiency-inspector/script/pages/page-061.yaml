page: 61
title: 'One person may apply'
purpose: "Show practical aftermath, retain the gains and complete Riju's
  personal arc through fair application."
location: junction-square
time: later that morning
layout: "Five-place morning montage ending at the Hall application portal and
  Vale's report case."
panelCount: 5
dialogueGoal: 'Let relief coexist with new administrative work and give Riju
  accountable hope rather than certainty.'
pageTurn: "Vale's final report arrives in a perfectly level case."
visualMotif: 'Parallel paper and digital routes staying open while one
  fragmented identity becomes one reviewable application.'
continuity:
  - 'Address correction and appeal desks operate while medicines, results and
    train information continue.'
  - 'Welfare payment is provisionally restored; contractor inquiry remains open;
    forecasts are challengeable; paper fallbacks are tested.'
  - "At the scheduled ten o'clock review, the occupied-site utility exception is
    renewed only through the next property-review window."
  - 'The grievance-token drum is signed out from the Hall to the Square desks
    with its remaining paper count recorded.'
  - "Riju's temporary badge has a public extension date and the open portal
    accepts exactly one application."
