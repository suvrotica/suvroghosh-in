      <path d="M310 380L410 155M328 388L428 163"/><path d="M324 353l22 10M341 316l22 10M358 278l22 10M375 240l22 10M392 202l22 10"/>
    </g>
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M460 65C390 105 478 162 394 208S430 326 338 390" stroke="#2B241F" stroke-width="28"/>
      <path d="M460 65C390 105 478 162 394 208S430 326 338 390" stroke="#C54435" stroke-width="19" stroke-dasharray="28 9 8 9"/>
      <path d="M210 90C128 136 236 200 144 265S176 362 96 415" stroke="#2B241F" stroke-width="25"/>
      <path d="M210 90C128 136 236 200 144 265S176 362 96 415" stroke="#326797" stroke-width="16" stroke-dasharray="22 7"/>
    </g>
    <g fill="#2B241F" font-family="Arial, sans-serif" font-size="16" font-weight="800">
      <text x="8" y="493">1</text><text x="452" y="493">10</text><text x="452" y="445">11</text><text x="8" y="445">20</text>
      <text x="8" y="61">100</text><text x="492" y="61" text-anchor="end">91</text>
    </g>
    <text x="250" y="475" text-anchor="middle" fill="#2B241F" font-family="Georgia, serif" font-size="23" font-weight="700">SAAP-LUDO</text>
  </g>

  <path d="M604 124c-8 155 7 297 0 602" fill="none" stroke="#4d4234" stroke-width="13" opacity=".35"/>
  <path d="M600 124c4 174-3 344 1 602" fill="none" stroke="#f2e1b8" stroke-width="4" opacity=".42"/>
  <path d="M76 137h1048M76 713h1048" stroke="#4e4132" stroke-width="2" stroke-dasharray="2 9" opacity=".35"/>
</svg>
