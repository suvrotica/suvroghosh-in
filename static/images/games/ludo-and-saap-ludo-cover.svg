<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Ludo and Saap-Ludo folding board</title>
  <desc id="desc">An original warm-paper illustration of a Ludo face beside a numbered snakes and ladders face, joined by a worn cardboard fold.</desc>
  <defs>
    <pattern id="wood" width="86" height="28" patternUnits="userSpaceOnUse">
      <rect width="86" height="28" fill="#2c211b"/>
      <path d="M0 8c18-7 37 5 58-1s23-3 28-2M0 22c28-5 47 5 86-2" fill="none" stroke="#5f4737" stroke-width="1" opacity=".45"/>
    </pattern>
    <pattern id="paper" width="73" height="61" patternUnits="userSpaceOnUse">
      <rect width="73" height="61" fill="#E4D3A7"/>
      <path d="M7 12h19M39 43h14M18 55h8M55 18h10" stroke="#6e604a" stroke-width=".8" opacity=".22"/>
      <circle cx="34" cy="19" r="1" fill="#41372d" opacity=".15"/>
    </pattern>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <rect width="48" height="48" fill="#dfd0a7" stroke="#2B241F" stroke-width="1.4"/>
      <path d="M0 0h48v48" fill="none" stroke="#fff" opacity=".1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#130d09" flood-opacity=".55"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#wood)"/>
  <text x="60" y="72" fill="#f4e4bd" font-family="Georgia, serif" font-size="42" font-weight="700">LUDO &amp; SAAP-LUDO</text>
  <text x="1140" y="68" text-anchor="end" fill="#cbb98e" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="3">TWO FACES · ONE AFTERNOON</text>

  <g filter="url(#shadow)">
    <rect x="55" y="110" width="1090" height="630" rx="7" fill="#80745D"/>
    <rect x="69" y="124" width="1062" height="602" fill="url(#paper)" stroke="#2B241F" stroke-width="3"/>
  </g>

  <g transform="translate(92 160)">
    <rect width="500" height="500" fill="#E4D3A7" stroke="#2B241F" stroke-width="4"/>
    <rect width="200" height="200" fill="#34804A"/>
    <rect x="300" width="200" height="200" fill="#D8AD32"/>
    <rect x="300" y="300" width="200" height="200" fill="#326797"/>
    <rect y="300" width="200" height="200" fill="#C54435"/>
    <g fill="#eadfbd" stroke="#2B241F" stroke-width="2">
      <rect x="34" y="34" width="132" height="132" rx="5"/><rect x="334" y="34" width="132" height="132" rx="5"/>
      <rect x="334" y="334" width="132" height="132" rx="5"/><rect x="34" y="334" width="132" height="132" rx="5"/>
    </g>
    <g fill="none" stroke="#2B241F" stroke-width="2">
      <path d="M200 0v200H0M300 0v200h200M500 300H300v200M200 500V300H0"/>
      <path d="M200 200H0M300 200h200M500 300H300M200 300H0"/>
    </g>
    <g stroke="#2B241F" stroke-width="2">
      <path d="M200 200l50 50-50 50z" fill="#34804A"/><path d="M200 200h100l-50 50z" fill="#D8AD32"/>
      <path d="M300 200v100l-50-50z" fill="#326797"/><path d="M200 300h100l-50-50z" fill="#C54435"/>
    </g>
    <g fill="#eadfbd" stroke="#2B241F" stroke-width="1.5">
      <rect x="200" width="33.3" height="200"/><rect x="233.3" width="33.3" height="200"/><rect x="266.6" width="33.4" height="200"/>
      <rect x="200" y="300" width="33.3" height="200"/><rect x="233.3" y="300" width="33.3" height="200"/><rect x="266.6" y="300" width="33.4" height="200"/>
      <rect y="200" width="200" height="33.3"/><rect y="233.3" width="200" height="33.3"/><rect y="266.6" width="200" height="33.4"/>
      <rect x="300" y="200" width="200" height="33.3"/><rect x="300" y="233.3" width="200" height="33.3"/><rect x="300" y="266.6" width="200" height="33.4"/>
    </g>
    <g fill="#2B241F" font-family="Arial, sans-serif" font-size="15" font-weight="800">
      <text x="14" y="486">LUDO</text><text x="486" y="20" text-anchor="end">লুডো</text>
    </g>
  </g>

  <g transform="translate(616 160)">
