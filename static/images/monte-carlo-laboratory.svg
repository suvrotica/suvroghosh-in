<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">The Monte Carlo pi laboratory</title>
  <desc id="description">A square mathematical field contains a unit circle. Teal circular samples fill the circle, coral diamond samples occupy the corners, and a restrained convergence trace approaches pi.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111e"/>
      <stop offset="1" stop-color="#111b29"/>
    </linearGradient>
    <radialGradient id="field" cx="45%" cy="42%" r="70%">
      <stop offset="0" stop-color="#173447"/>
      <stop offset="1" stop-color="#0b1724"/>
    </radialGradient>
    <pattern id="insidePoints" width="34" height="31" patternUnits="userSpaceOnUse" patternTransform="rotate(7)">
      <circle cx="7" cy="8" r="3.6" fill="#67e8d2" opacity=".82"/>
      <circle cx="25" cy="22" r="2.6" fill="#99f6e4" opacity=".58"/>
      <circle cx="31" cy="5" r="1.8" fill="#5eead4" opacity=".72"/>
    </pattern>
    <pattern id="outsidePoints" width="38" height="35" patternUnits="userSpaceOnUse" patternTransform="rotate(-5)">
      <rect x="5" y="6" width="6" height="6" rx="1" fill="#fb9279" opacity=".78" transform="rotate(45 8 9)"/>
      <rect x="27" y="24" width="5" height="5" rx=".8" fill="#fdba74" opacity=".55" transform="rotate(45 29.5 26.5)"/>
      <rect x="31" y="4" width="3.5" height="3.5" fill="#fb9279" opacity=".62" transform="rotate(45 32.75 5.75)"/>
    </pattern>
    <clipPath id="circleClip"><circle cx="365" cy="315" r="226"/></clipPath>
    <mask id="outsideMask">
      <rect x="139" y="89" width="452" height="452" fill="white"/>
      <circle cx="365" cy="315" r="226" fill="black"/>
    </mask>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#background)"/>
  <path d="M0 80H1200M0 160H1200M0 240H1200M0 320H1200M0 400H1200M0 480H1200M0 560H1200M80 0V630M160 0V630M240 0V630M320 0V630M400 0V630M480 0V630M560 0V630M640 0V630M720 0V630M800 0V630M880 0V630M960 0V630M1040 0V630M1120 0V630" stroke="#94a3b8" stroke-width="1" opacity=".07"/>

  <g>
    <rect x="139" y="89" width="452" height="452" rx="5" fill="url(#field)" stroke="#d9e3e8" stroke-width="3"/>
    <path d="M139 202H591M139 315H591M139 428H591M252 89V541M365 89V541M478 89V541" stroke="#9fb2bd" stroke-width="1" opacity=".26"/>
    <path d="M139 315H591M365 89V541" stroke="#d5e0e5" stroke-width="1.5" opacity=".38"/>
    <rect x="139" y="89" width="452" height="452" fill="url(#outsidePoints)" mask="url(#outsideMask)"/>
    <rect x="139" y="89" width="452" height="452" fill="url(#insidePoints)" clip-path="url(#circleClip)"/>
    <circle cx="365" cy="315" r="226" fill="none" stroke="#f4f7f8" stroke-width="4" filter="url(#softGlow)"/>
    <rect x="139" y="89" width="452" height="452" rx="5" fill="none" stroke="#f4f7f8" stroke-width="3"/>
  </g>

  <g transform="translate(665 92)">
    <text x="0" y="28" fill="#99f6e4" font-family="ui-monospace,monospace" font-size="24" font-weight="700" letter-spacing="3">MONTE CARLO LAB</text>
    <text x="0" y="105" fill="#f8fafc" font-family="ui-monospace,monospace" font-size="64" font-weight="700">π̂ 3.1417</text>
    <text x="4" y="144" fill="#a9bac5" font-family="ui-monospace,monospace" font-size="22">4 × inside / total</text>

    <rect x="0" y="190" width="454" height="204" rx="12" fill="#0a1320" stroke="#3e5361" stroke-width="2"/>
    <path d="M38 225V358H425M38 258H425M38 291H425M38 324H425" fill="none" stroke="#78909d" opacity=".22"/>
    <path d="M38 285H425" stroke="#f1f5f9" stroke-width="2" stroke-dasharray="8 8" opacity=".58"/>
    <path d="M38 220C72 342 100 242 133 313S194 258 224 297S273 274 302 290S352 281 382 286S408 284 425 285" fill="none" stroke="#5eead4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#99f6e4" stroke="#083b38" stroke-width="2">
      <circle cx="38" cy="220" r="6"/><circle cx="133" cy="313" r="6"/><circle cx="224" cy="297" r="6"/><circle cx="302" cy="290" r="6"/><circle cx="382" cy="286" r="6"/><circle cx="425" cy="285" r="6"/>
    </g>
    <text x="0" y="438" fill="#c7d2d9" font-family="ui-monospace,monospace" font-size="21">samples remain disorderly</text>
    <text x="0" y="472" fill="#f8fafc" font-family="ui-monospace,monospace" font-size="25" font-weight="700">the estimate converges</text>
  </g>
</svg>
