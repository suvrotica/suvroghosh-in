xt x="990" y="366" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#292d27">Make understanding useful</text><text x="990" y="409" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#697164">Connect ideas · Teach what you know</text><path d="M712 360 C770 360 770 495 860 495" fill="none" stroke="#6d8c83" stroke-width="3"/><rect x="845" y="468" width="290" height="54" rx="9" fill="#fffdf7" stroke="#6d8c83"/><text x="990" y="501" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#292d27">Leave room to revise</text><text x="990" y="544" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#697164">Mark uncertainty · Ask the next question</text>
