<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">The Static-Equilibrium Illusion</title>
  <desc id="desc">An editorial diagram on warm paper: a disturbed trace returns, rings, then opens into a closed orbit beside the essay title and evidence labels.</desc>
  <rect width="1200" height="630" fill="#f3ecdf"/>
  <rect x="38" y="38" width="1124" height="554" fill="none" stroke="#251f19" stroke-width="2"/>
  <line x1="56" y1="104" x2="1144" y2="104" stroke="#9c9486"/>
  <text x="68" y="82" fill="#1f6b68" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2.4">A VISUAL ESSAY ABOUT DYNAMIC STABILITY</text>

  <text x="68" y="180" fill="#251f19" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" letter-spacing="-1.5">
    <tspan x="68" dy="0">THE STATIC-</tspan>
    <tspan x="68" dy="69">EQUILIBRIUM</tspan>
    <tspan x="68" dy="69">ILLUSION</tspan>
  </text>
  <text x="70" y="414" fill="#51483e" font-family="Georgia, 'Times New Roman', serif" font-size="25">
    <tspan x="70" dy="0">Life keeps its balance</tspan>
    <tspan x="70" dy="34">by refusing to hold still.</tspan>
  </text>

  <g aria-label="Return, ring and orbit conceptual trace">
    <line x1="596" y1="304" x2="1124" y2="304" stroke="#1f6b68" stroke-width="2"/>
    <line x1="596" y1="294" x2="596" y2="314" stroke="#1f6b68" stroke-width="2"/>
    <path d="M596 304 C630 222 662 279 696 299 C728 317 753 311 786 304" fill="none" stroke="#aa4533" stroke-width="6" stroke-linecap="round"/>
    <path d="M786 304 C810 205 839 394 874 245 C904 152 934 441 975 235 C1007 76 1110 133 1110 304" fill="none" stroke="#aa4533" stroke-width="6" stroke-linecap="round"/>
    <path d="M1110 304 C1110 385 1059 444 994 444 C930 444 886 390 886 321 C886 250 934 197 997 197 C1061 197 1110 247 1110 304 Z" fill="none" stroke="#aa4533" stroke-width="6"/>
    <line x1="986" y1="304" x2="1008" y2="304" stroke="#251f19" stroke-width="2"/>
    <line x1="997" y1="293" x2="997" y2="315" stroke="#251f19" stroke-width="2"/>
    <text x="618" y="348" fill="#51483e" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.8">RETURN</text>
    <text x="807" y="348" fill="#51483e" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.8">RING</text>
    <text x="1013" y="474" fill="#51483e" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.8">ORBIT</text>
  </g>

  <line x1="56" y1="508" x2="1144" y2="508" stroke="#9c9486"/>
  <g transform="translate(70 538)" fill="none" stroke="#251f19" stroke-width="2">
    <path d="M0 16 V2 M0 9 H24 M24 16 V2"/>
    <circle cx="211" cy="9" r="6" fill="#251f19"/>
    <path d="M420 9 H452" stroke="#aa4533" stroke-width="4"/>
    <path d="M654 9 H686" stroke="#746279" stroke-dasharray="3 5"/>
  </g>
  <g fill="#251f19" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1.4">
    <text x="105" y="554">RANGE</text>
    <text x="298" y="554">SUMMARY</text>
    <text x="535" y="554">MODEL</text>
    <text x="770" y="554">DISPUTED</text>
  </g>
  <text x="1128" y="579" text-anchor="end" fill="#51483e" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.1">CONCEPTUAL MAP · NOT CLINICAL DATA</text>
</svg>
