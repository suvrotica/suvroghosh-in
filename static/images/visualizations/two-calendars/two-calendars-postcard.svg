<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="postcard-title postcard-description">
	<title id="postcard-title">Two Calendars, One Life — 1947</title>
	<desc id="postcard-description">Two Calendars, One Life · 1947: a year in two worlds.

Calcutta / India — 15 August 1947: Freedom, with a border through Bengal.

America — 15 April 1947: Number 42 steps onto the field.

Shared time: In the same year, India became independent through Partition and Robinson crossed a colour barrier in Brooklyn. Their scale, causes and consequences differ. The shared-year thread asks what a public breakthrough changes, and which barriers remain outside its reach.

https://suvroghosh.in/blog/visualizations/two-calendars-one-life?year=1947
Sources:
UK Parliament / The National Archives: Indian Independence Act 1947, original text — https://www.legislation.gov.uk/ukpga/1947/30/pdfs/ukpga_19470030_en.pdf
Library of Congress: Jackie Robinson breaks the color line — https://www.loc.gov/item/today-in-history/april-15/</desc>
